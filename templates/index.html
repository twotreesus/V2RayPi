<html lang="en">

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="format-detection" content="telephone=no" />
    <title>V2RayPi</title>

    <link rel="stylesheet" href="/static/css/mdui.css">
    <script src="/static/js/mdui.js"></script>
    <link href="/static/css/prism.css" rel="stylesheet" />
    <script src="/static/js/prism.js"></script>
    <style>
        html {
            overflow-y: scroll;
        }
        #content_page {
            overflow-x: hidden;
            padding-bottom: 40px;
        }
        .mdui-list-item-active {
            background-color: #07c160 !important;
        }
        .mdui-list-item-active,
        .mdui-list-item-active .mdui-list-item-icon,
        .mdui-list-item-active .mdui-list-item-content {
            color: #fff !important;
        }
        .mdui-btn.mdui-color-theme-accent,
        .mdui-btn.mdui-color-theme-accent:hover,
        .mdui-btn.mdui-color-theme-a100,
        .mdui-btn.mdui-color-theme-a100:hover {
            background-color: #0288d1 !important;
            color: #fff !important;
        }
        .mdui-btn.mdui-color-theme {
            background-color: #07c160 !important;
            color: #fff !important;
        }
        .mdui-color-green,
        .mdui-color-green-300,
        .mdui-color-green-500 {
            background-color: #07c160 !important;
        }
        .mdui-text-color-green {
            color: #07c160 !important;
        }
        .node-type-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 600;
            line-height: 1;
            padding: 1px 4px;
            border-radius: 3px;
            border: 1px solid;
            vertical-align: middle;
        }
        .node-type-vmess  { color: #1976d2; border-color: #1976d2; background-color: rgba(25,118,210,0.08); }
        .node-type-vless  { color: #7b1fa2; border-color: #7b1fa2; background-color: rgba(123,31,162,0.08); }
        .node-type-anytls { color: #0097a7; border-color: #0097a7; background-color: rgba(0,151,167,0.08); }
        .node-type-ss     { color: #e91e63; border-color: #e91e63; background-color: rgba(233,30,99,0.08); }
    </style>
</head>

<body class="mdui-appbar-with-toolbar mdui-theme-primary-teal mdui-theme-accent-light-blue mdui-loaded mdui-drawer-body-left">
    <!--head bar-->
    <header class="mdui-appbar mdui-appbar-fixed">
        <div class="mdui-toolbar" style="background-color: #263238; color: #fff; align-items: center;">
            <span class="mdui-btn mdui-btn-icon mdui-ripple mdui-ripple-white" mdui-drawer="{target: '#main-drawer', swipe: true}"><i class="mdui-icon material-icons">menu</i></span>
            <a href="./" class="mdui-typo-headline mdui-hidden-xs">V2RayPi</a>
            <a id="head_title" href="" class="mdui-typo-title"></a>
            <div class="mdui-toolbar-spacer"></div>
            <div id="header_status" style="display: none; align-items: center; font-size: 12px; white-space: nowrap; margin-right: 8px; border-radius: 10px; height: 26px; align-self: center; overflow: hidden;">
                <div style="display: flex; align-items: center; gap: 6px; padding: 0 10px; height: 100%; background: #fff; color: rgba(0,0,0,0.75); min-width: 160px;">
                    <span id="hs_dot" style="font-size: 24px; flex-shrink: 0; line-height: 12px; position: relative; top: -1px;">●</span>
                    <span id="hs_mode" style="flex-shrink: 0; font-weight: 600;"></span>
                    <span style="opacity: 0.4; flex-shrink: 0;">|</span>
                    <span id="hs_protocol" class="node-type-badge" style="flex-shrink: 0; display: none; margin-right: 0;"></span>
                    <span id="hs_node" style="font-weight: 600;"></span>
                </div>
                <div style="display: flex; align-items: center; justify-content: center; padding: 0 10px; height: 100%; background: #FF9800; color: #fff; width: 100px; flex-shrink: 0;">
                    <i class="mdui-icon material-icons" style="font-size: 14px; margin-right: 2px;">arrow_upward</i><span id="hs_upload" style="font-size: 11px; font-weight: 600;">-</span>
                </div>
                <div style="display: flex; align-items: center; justify-content: center; padding: 0 10px; height: 100%; background: #07c160; color: #fff; width: 100px; flex-shrink: 0;">
                    <i class="mdui-icon material-icons" style="font-size: 14px; margin-right: 2px;">arrow_downward</i><span id="hs_download" style="font-size: 11px; font-weight: 600;">-</span>
                </div>
            </div>
            <a href="https://github.com/twotreesus/V2RayPi" target="_blank" class="mdui-btn mdui-btn-icon mdui-ripple mdui-ripple-white" mdui-tooltip="{content: 'Github'}">
                <svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" viewBox="0 0 36 36" enable-background="new 0 0 36 36" xml:space="preserve" class="mdui-icon" style="width: 24px;height:24px;">
                            <path fill-rule="evenodd" clip-rule="evenodd" fill="#ffffff" d="M18,1.4C9,1.4,1.7,8.7,1.7,17.7c0,7.2,4.7,13.3,11.1,15.5
            c0.8,0.1,1.1-0.4,1.1-0.8c0-0.4,0-1.4,0-2.8c-4.5,1-5.5-2.2-5.5-2.2c-0.7-1.9-1.8-2.4-1.8-2.4c-1.5-1,0.1-1,0.1-1
            c1.6,0.1,2.5,1.7,2.5,1.7c1.5,2.5,3.8,1.8,4.7,1.4c0.1-1.1,0.6-1.8,1-2.2c-3.6-0.4-7.4-1.8-7.4-8.1c0-1.8,0.6-3.2,1.7-4.4
            c-0.2-0.4-0.7-2.1,0.2-4.3c0,0,1.4-0.4,4.5,1.7c1.3-0.4,2.7-0.5,4.1-0.5c1.4,0,2.8,0.2,4.1,0.5c3.1-2.1,4.5-1.7,4.5-1.7
            c0.9,2.2,0.3,3.9,0.2,4.3c1,1.1,1.7,2.6,1.7,4.4c0,6.3-3.8,7.6-7.4,8c0.6,0.5,1.1,1.5,1.1,3c0,2.2,0,3.9,0,4.5
            c0,0.4,0.3,0.9,1.1,0.8c6.5-2.2,11.1-8.3,11.1-15.5C34.3,8.7,27,1.4,18,1.4z"></path>
                        </svg>
            </a>
        </div>
    </header>
    <!--menu-->
    <div class="mdui-drawer" id="main-drawer">
        <div class="mdui-list">
            <div id="status" class="mdui-list-item mdui-ripple mdui-list-item-active">
                <i class="mdui-list-item-icon mdui-icon material-icons">play_arrow</i>
                <div class="mdui-list-item-content">运行状态</div>
            </div>
            <div id="subscribe" class="mdui-list-item mdui-ripple">
                <i class="mdui-list-item-icon mdui-icon material-icons">links</i>
                <div class="mdui-list-item-content">订阅节点</div>
            </div>
            <div id="advance" class="mdui-list-item mdui-ripple">
                <i class="mdui-list-item-icon mdui-icon material-icons">tune</i>
                <div class="mdui-list-item-content">高级设置</div>
            </div>
            <div id="system" class="mdui-list-item mdui-ripple">
                <i class="mdui-list-item-icon mdui-icon material-icons">settings</i>
                <div class="mdui-list-item-content">系统维护</div>
            </div>
        </div>
    </div>
    <!--login dialog-->
    <div id="login_dialog" class="mdui-dialog">
        <div class="mdui-dialog-title">请登录以继续</div>
        <div class="mdui-dialog-content">
            <div class="mdui-row mdui-valign" style="margin-top: 20px">
                <div class="mdui-col-xs-2 mdui-valign">
                    <div class="mdui-typo-subheading" style="line-height: 36px">管理密码</div>
                </div>
                <div class="mdui-col-xs-10">
                    <input id="login_password" class="mdui-textfield-input" type="password" />
                </div>
            </div>
        </div>
        <div class="mdui-dialog-actions">
            <button id="login_button" type="button" class="mdui-btn mdui-ripple mdui-color-theme">登录</button>
        </div>
    </div>
    
    <!--content page-->
    <div id="content_page"></div>
    <!--toast-->
    <div id="toast" class="mdui-dialog">
        <div class="mdui-dialog-content">
            <div class="mdui-row mdui-valign">
                <div class="mdui-col-md-1 mdui-valign">
                    <div class="mdui-spinner"></div>
                </div>
                <div id="toast_message" class="mdui-col">Hello World !</div>
            </div>
        </div>
    </div>
</body>

<script type="text/javascript">
    var g_intervals = [];
    function add_interval(i) {
        g_intervals.push(i);
    }

    function remove_interval(i) {
        if (i) {
            clearInterval(i);
            g_intervals = g_intervals.filter(item => item !== i);
        }
    }

    function clear_intervals() {
        g_intervals.forEach(function (i) {
            clearInterval(i);
        });
        g_intervals.length = 0;
    }

    // toast
    var g_toast = null;
    function pop_toast(message) {
        $("#toast_message").html(message);
        g_toast = new mdui.Dialog("#toast", { modal:true, closeOnEsc:false, history: false});
        g_toast.open();
        mdui.mutation();
        return g_toast;
    }

    function update_toast(message) {
        $("#toast_message").html(message);
    }

    function close_toast() {
        setTimeout(function () {
            g_toast.close();
            g_toast.destroy();
            g_toast = null;
        }, 500);
    }

    // message
    function message(message) {
        mdui.snackbar({
            message: message,
            position: "top",
            timeout: 1000
        })
    }
    
    // login
    function show_login_dialog() {
        $("#login_password").val("");
        if (!g_login_dialog) {
            g_login_dialog = new mdui.Dialog('#login_dialog', { modal: true, closeOnEsc: false, history: false });
        }
        g_login_dialog.open();
        mdui.mutation();
        $("#login_password").focus();
    }

    function close_login_dialog() {
        if (!g_login_dialog) {
            return;
        }
        g_login_dialog.close();
    }
    
    function login(password, callback) {
        $.ajax({
            url: "/api/login",
            type: "POST",
            contentType: "application/json",
            dataType: "json",
            data: JSON.stringify({ "password": password })
        })
            .done(function(data) {
                if (data["result"] === "ok") {
                    if (callback) callback(true);
                } else {
                    message("密码错误，请重试");
                    setTimeout(show_login_dialog, 1000);
                }
            })
            .fail(function() {
                message("登录失败，请重试");
                setTimeout(show_login_dialog, 1000);
            });
    }

    // utility
    function check_result(data) {
        if (data["result"] === "session_error") {
            return false;
        }
        return data["result"] === "ok";
    }
    
    // Unified AJAX request wrapper with Promise chain support
    function ajax_request(options) {
        var defaults = {
            type: "GET",
            contentType: "application/json",
            dataType: "json"
        };
        
        // Merge default options with user options
        var settings = $.extend({}, defaults, options);
        
        // Create a new Promise to handle the request
        return $.ajax(settings)
            .then(function(data) {
                // Handle session expiration
                if (data && data["result"] === "session_error") {
                    // Clear all intervals to prevent repeated login dialogs
                    clear_intervals();
                    show_login_dialog();
                    // Return rejected promise with original data
                    return Promise.reject(data);
                }
                return data;
            });
    }

    function copy_to_clipboard(text) {
        if (window.clipboardData && window.clipboardData.setData) {
            // Internet Explorer-specific code path to prevent textarea being shown while dialog is visible.
            return clipboardData.setData("Text", text);

        }
        else if (document.queryCommandSupported && document.queryCommandSupported("copy")) {
            var textarea = document.createElement("textarea");
            textarea.textContent = text;
            textarea.style.position = "fixed";  // Prevent scrolling to bottom of page in Microsoft Edge.
            document.body.appendChild(textarea);
            textarea.select();
            try {
                return document.execCommand("copy");  // Security exception may be thrown by some browsers.
            }
            catch (ex) {
                console.warn("Copy to clipboard failed.", ex);
                return false;
            }
            finally {
                document.body.removeChild(textarea);
            }
        }
    }

    var g_login_dialog = null;

    // Initialize all event handlers
    function init_events() {
        
        var menus = {
            "status" : "status.html",
            "subscribe" : "subscribe.html",
            "advance" : "advance.html",
            "system" : "system.html"
        }

        $(".mdui-list-item").click(function () {
            clear_intervals();

            var id = $(this).attr("id");
            if (id in menus) {
                var title = $(this).find(".mdui-list-item-content").text();
                $("#head_title").html(title);
                $(".mdui-list-item").removeClass("mdui-list-item-active");
                $(this).addClass("mdui-list-item-active");

                var url = menus[id];
                ajax_request({
                    url: url,
                    dataType: "html",
                    success: function(data) {
                        $("#content_page").empty().html(data);
                    }
                })
            }
        });
    }

    // Handle login submit
    function handle_login_submit() {
        var password = $("#login_password").val();
        if (!password) {
            $("#login_error").text("请输入密码").show();
            return;
        }
        
        login(password, function(success) {
            if (success) {
                close_login_dialog();
                $("#status").click();
                refresh_header_status();
                add_interval(setInterval(refresh_header_status, 1000));
            }
        });
    }
    
    // Setup login handlers
    function setup_login_handler() {
        // Handle button click
        $("#login_button").click(function() {
            // Only handle login if it's a real click event
            if (event.isTrusted) {
                handle_login_submit();
            }
        });
        
        // Handle enter key in password input
        $("#login_password").keypress(function(e) {
            if (e.which === 13) {
                handle_login_submit();
            }
        });
    }

    // Hide all content until session is verified
    $(document).ready(function() {
        // Initialize event handlers        
        init_events();
        
        // Setup login handlers
        setup_login_handler();

        // Check session status before loading page
        ajax_request({ url: '/api/refresh' })
            .done(function() {
                $("#status").click();
                refresh_header_status();
                setInterval(refresh_header_status, 1000);
            });
    });

    var g_proxy_modes = ['直连', '分流', '全局'];

    function hs_format_speed(kb) {
        if (kb >= 1024) return (kb / 1024).toFixed(2) + ' MB/s';
        if (kb >= 1) return kb.toFixed(1) + ' KB/s';
        return Math.round(kb * 1024) + ' B/s';
    }

    var g_hs_up_samples = [];
    var g_hs_down_samples = [];

    function refresh_header_status() {
        $.ajax({ url: '/get_status', dataType: 'json' })
            .done(function(data) {
                var running = data['running'];
                $('#hs_dot').css('color', running ? '#07c160' : '#ff8888');
                $('#hs_mode').text(g_proxy_modes[data['proxy_mode']] || '');
                var protocol = (data['protocol'] || '').toLowerCase();
                $('#hs_protocol')
                    .text(protocol)
                    .attr('class', 'node-type-badge node-type-' + protocol)
                    .toggle(!!protocol);
                $('#hs_node').text(data['ps'] || '');
                $('#header_status').css('display', 'flex');
            });
        $.ajax({ url: '/get_performance', dataType: 'json' })
            .done(function(data) {
                var net = data['network'];
                if (!net) return;
                g_hs_up_samples.push(net['upload']);
                g_hs_down_samples.push(net['download']);
                if (g_hs_up_samples.length > 3) g_hs_up_samples.shift();
                if (g_hs_down_samples.length > 3) g_hs_down_samples.shift();
                var up = g_hs_up_samples.reduce(function(a, b) { return a + b; }, 0) / g_hs_up_samples.length;
                var down = g_hs_down_samples.reduce(function(a, b) { return a + b; }, 0) / g_hs_down_samples.length;
                $('#hs_upload').text(hs_format_speed(up));
                $('#hs_download').text(hs_format_speed(down));
            });
    }
</script>
</html>
