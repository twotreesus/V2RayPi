<script type="text/javascript">
    var g_intervals = [];
    function add_interval(i) {
        g_intervals.push(i);
    }

    function remove_interval(i) {
        if (i) {
            clearInterval(i);
            g_intervals = g_intervals.filter(item => item !== i);
        }
    }

    function clear_intervals() {
        g_intervals.forEach(function (i) {
            clearInterval(i);
        });
        g_intervals.length = 0;
    }

    // toast
    var g_toast = null;
    function pop_toast(message) {
        $("#toast_message").html(message);
        g_toast = new mdui.Dialog("#toast", { modal:true, closeOnEsc:false, history: false});
        g_toast.open();
        mdui.mutation();
        return g_toast;
    }

    function update_toast(message) {
        $("#toast_message").html(message);
    }

    function close_toast() {
        setTimeout(function () {
            g_toast.close();
            g_toast.destroy();
            g_toast = null;
        }, 500);
    }

    // message
    function message(message) {
        mdui.snackbar({
            message: message,
            position: "top",
            timeout: 1000
        })
    }
    
    // login
    function show_login_dialog() {
        $("#login_password").val("");
        $("#login_error").hide();
        if (!g_login_dialog) {
            g_login_dialog = new mdui.Dialog('#login_dialog', { modal: true, closeOnEsc: false, history: false });
        }
        g_login_dialog.open();
        mdui.mutation();
        $("#login_password").focus();
    }

    function close_login_dialog() {
        if (!g_login_dialog) {
            return;
        }
        g_login_dialog.close();
    }
    
    function login(password, callback) {
        $.ajax({
            url: "/api/login",
            type: "POST",
            contentType: "application/json",
            dataType: "json",
            data: JSON.stringify({ "password": password })
        })
            .done(function(data) {
                if (data["result"] === "ok") {
                    if (callback) callback(true);
                } else {
                    message(t("login.invalid"));
                    setTimeout(show_login_dialog, 1000);
                }
            })
            .fail(function() {
                message(t("login.failed"));
                setTimeout(show_login_dialog, 1000);
            });
    }

    // utility
    function check_result(data) {
        if (data["result"] === "session_error") {
            return false;
        }
        return data["result"] === "ok";
    }
    
    // Unified AJAX request wrapper with Promise chain support
    function ajax_request(options) {
        var defaults = {
            type: "GET",
            contentType: "application/json",
            dataType: "json"
        };
        
        // Merge default options with user options
        var settings = $.extend({}, defaults, options);
        
        // Create a new Promise to handle the request
        return $.ajax(settings)
            .then(function(data) {
                // Handle session expiration
                if (data && data["result"] === "session_error") {
                    // Clear all intervals to prevent repeated login dialogs
                    clear_intervals();
                    show_login_dialog();
                    // Return rejected promise with original data
                    return Promise.reject(data);
                }
                return data;
            });
    }

    function copy_to_clipboard(text) {
        if (window.clipboardData && window.clipboardData.setData) {
            // Internet Explorer-specific code path to prevent textarea being shown while dialog is visible.
            return clipboardData.setData("Text", text);

        }
        else if (document.queryCommandSupported && document.queryCommandSupported("copy")) {
            var textarea = document.createElement("textarea");
            textarea.textContent = text;
            textarea.style.position = "fixed";  // Prevent scrolling to bottom of page in Microsoft Edge.
            document.body.appendChild(textarea);
            textarea.select();
            try {
                return document.execCommand("copy");  // Security exception may be thrown by some browsers.
            }
            catch (ex) {
                console.warn("Copy to clipboard failed.", ex);
                return false;
            }
            finally {
                document.body.removeChild(textarea);
            }
        }
    }

    var g_login_dialog = null;
    var g_nav_drawer = null;

    // Must match the phone breakpoint in app.css, where the drawer turns into a
    // floating menu.
    var NAV_FLOATING_QUERY = "(max-width: 599px)";

    // Initialize all event handlers
    function init_events() {
        
        var menus = {
            "status" : "status.html",
            "subscribe" : "subscribe.html",
            "advance" : "advance.html",
            "system" : "system.html"
        }

        g_nav_drawer = new mdui.Drawer("#main-drawer", { swipe: true });
        $("#nav_toggle").click(function () {
            g_nav_drawer.toggle();
        });

        $(".mdui-list-item").click(function () {
            clear_intervals();

            var id = $(this).attr("id");
            if (id in menus) {
                var title = $(this).find(".mdui-list-item-content").text();
                $("#head_title").html(title);
                $(".mdui-list-item").removeClass("mdui-list-item-active");
                $(this).addClass("mdui-list-item-active");

                var url = menus[id];
                ajax_request({
                    url: url,
                    dataType: "html",
                    success: function(data) {
                        $("#content_page").empty().html(data);
                        I18n.apply(document.getElementById("content_page"));
                        mdui.mutation();
                    }
                })

                // The floating navigation has to dismiss itself once a page is
                // picked; the desktop drawer is permanent and stays put.
                if (window.matchMedia(NAV_FLOATING_QUERY).matches) {
                    g_nav_drawer.close();
                }
            }
        });
    }

    // Handle login submit
    function handle_login_submit() {
        var password = $("#login_password").val();
        if (!password) {
            $("#login_error").text(t("login.required")).show();
            return;
        }
        
        login(password, function(success) {
            if (success) {
                close_login_dialog();
                $("#status").click();
                start_header_status_polling();
            }
        });
    }
    
    // Setup login handlers
    function setup_login_handler() {
        // Handle button click
        $("#login_button").click(function() {
            // Only handle login if it's a real click event
            if (event.isTrusted) {
                handle_login_submit();
            }
        });
        
        // Handle enter key in password input
        $("#login_password").keypress(function(e) {
            if (e.which === 13) {
                handle_login_submit();
            }
        });
    }

    // Hide all content until session is verified
    $(document).ready(function() {
        I18n.apply(document);

        // Initialize event handlers        
        init_events();
        
        // Setup login handlers
        setup_login_handler();

        // Check session status before loading page
        ajax_request({ url: '/api/refresh' })
            .done(function() {
                $("#status").click();
                start_header_status_polling();
            });
    });

    I18n.onChange(function () {
        var active = $(".mdui-list-item-active");
        if (active.length) {
            active.click();
        }
    });

    var g_proxy_modes = ['mode.direct', 'mode.smart', 'mode.global'];

    function hs_format_speed(kb) {
        if (kb >= 1024) return (kb / 1024).toFixed(2) + ' MB/s';
        if (kb >= 1) return kb.toFixed(1) + ' KB/s';
        return Math.round(kb * 1024) + ' B/s';
    }

    function hs_protocol_badge(protocol) {
        // The protocol comes straight from the Clash `type` field, so any type
        // mihomo supports can show up here.  Only a few get their own colour;
        // the rest share a neutral badge instead of an undefined class.
        protocol = (protocol || '').toLowerCase();
        var labels = { hysteria2: 'hy2', hysteria: 'hy1', socks5: 'socks', wireguard: 'wg' };
        var styled = ['vmess', 'vless', 'ss', 'anytls', 'mieru', 'trojan', 'tuic', 'hy2'];
        var label = labels[protocol] || protocol || 'unknown';
        var className = styled.indexOf(label) !== -1 ? label : 'other';
        return { label: label, className: className };
    }

    function update_header_status(data) {
        var running = data['running'];
        $('#hs_dot').css('color', running ? '#07c160' : '#ff8888');
        var modeKey = g_proxy_modes[data['proxy_mode']];
        $('#hs_mode').text(modeKey ? t(modeKey) : '');
        var protocol = hs_protocol_badge(data['protocol']);
        $('#hs_protocol')
            .text(protocol.label)
            .attr('class', 'node-type-badge node-type-' + protocol.className)
            .toggle(!!protocol.label);
        $('#hs_node').text(data['ps'] || '');
        $('#header_status').addClass('is-visible');
        $(document.body).addClass('with-status-bar');
    }

    var g_hs_interval = null;

    function hs_latest_rate(series) {
        return (series && series.length) ? series[series.length - 1] : 0;
    }

    // The header is always visible, so its poller is not registered with
    // add_interval: it must survive the clear_intervals() on page switches.
    function start_header_status_polling() {
        refresh_header_status();
        if (g_hs_interval) return;
        g_hs_interval = setInterval(refresh_header_status, 1000);
    }

    function refresh_header_status() {
        $.ajax({ url: '/get_status', dataType: 'json', cache: false })
            .done(function(data) {
                update_header_status(data);
            });
        $.ajax({ url: '/get_performance', dataType: 'json', cache: false })
            .done(function(data) {
                // The backend already averages the rate over its own window, so the
                // header and the status charts report the same speed by construction.
                var history = data['history'];
                if (!history) return;
                $('#hs_upload').text(hs_format_speed(hs_latest_rate(history['upload'])));
                $('#hs_download').text(hs_format_speed(hs_latest_rate(history['download'])));
            });
    }
</script>
