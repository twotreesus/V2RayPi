<div class="mdui-container">
    <p></p>
    <div class="mdui-row">
        <div class="mdui-table-fluid">
            <!-- 订阅列表表格 -->
            <table class="mdui-table">
                <tbody id="subscribe_body">
                <tr>
                    <td colspan="5">
                        <div class="mdui-row" style="width: 100%; display: flex; align-items: center;">
                            <div style="display: flex; align-items: center; gap: 8px; white-space: nowrap;">
                                <strong class="mdui-typo">最近订阅</strong>
                                <span id="last_subscribe" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px;"></span>
                            </div>
                            <div style="flex: 1;"></div>
                            <div style="display: flex; align-items: center;">
                                <div style="display: flex; gap: 8px; justify-content: flex-end; padding-right: 8px;">
                                    <div id="update_all_subscribe" style="display: none">
                                        <button class="mdui-btn mdui-btn-raised mdui-btn-dense mdui-color-theme-accent mdui-ripple" onclick="update_all_subscribe()">全部更新</button>
                                    </div>
                                    <div>
                                        <button class="mdui-btn mdui-btn-raised mdui-btn-dense mdui-color-theme-accent mdui-ripple" onclick="add_subscribe()">新增订阅</button>
                                    </div>
                                    <div id="ping_test" style="display: none">
                                        <button class="mdui-btn mdui-btn-raised mdui-btn-dense mdui-color-theme-accent mdui-ripple" onclick="ping_test()">ping</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr class="mdui-color-grey-100" style="height: 8px;"><td colspan="5"></td></tr>
                <tr id="subscribe_template" class="mdui-color-light-blue-50" style="display: none">
                    <td colspan="5">
                        <div class="mdui-row" style="width: 100%; display: flex; align-items: center;">
                            <div class="mdui-col-xs-1" style="width: 8%; display: flex; align-items: center;">
                                <div style="display: flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap;" class="toggle-row">
                                    <i class="mdui-icon material-icons group-toggle">expand_more</i>
                                    <strong class="mdui-typo subscribe-index" style="white-space: nowrap;">订阅地址</strong>
                                </div>
                            </div>
                            <div style="flex: 1; min-width: 0; display: flex; align-items: center;">
                                <strong class="url" style="display: block; max-width: 64ch; word-break: break-all; white-space: normal;"></strong>
                            </div>
                            <div style="flex-shrink: 0; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px;">
                                <div style="display: flex; gap: 8px;">
                                    <div>
                                        <button class="copy_url mdui-btn mdui-btn-raised mdui-btn-dense mdui-color-theme-accent mdui-ripple" mdui-tooltip="{'content': '复制订阅地址'}">复制</button>
                                    </div>
                                    <div>
                                        <button class="show_subscribe_qr mdui-btn mdui-btn-raised mdui-btn-dense mdui-color-theme-accent mdui-ripple" mdui-tooltip="{'content': '显示订阅地址二维码'}">二维码</button>
                                    </div>
                                    <div>
                                        <button class="update_subscribe mdui-btn mdui-btn-raised mdui-btn-dense mdui-color-theme-accent mdui-ripple">更新</button>
                                    </div>
                                    <div>
                                        <button class="remove_subscribe mdui-btn mdui-btn-raised mdui-btn-dense mdui-color-red-400 mdui-ripple">删除</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr id="manual_template" class="mdui-color-light-blue-50" style="display: none">
                    <td colspan="5">
                        <div style="width: 100%; display: flex; align-items: center;">
                            <div style="display: flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap;" class="toggle-row">
                                <i class="mdui-icon material-icons group-toggle">expand_more</i>
                                <strong class="mdui-typo subscribe-index" style="white-space: nowrap;">收藏</strong>
                            </div>
                            <div style="flex: 1;"></div>
                            <div style="flex-shrink: 0; padding-right: 8px;">
                                <button class="mdui-btn mdui-btn-raised mdui-btn-dense mdui-color-theme-accent mdui-ripple" onclick="add_manual_node()">添加</button>
                            </div>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
            
            <!-- Node list container: each group renders its own independent table -->
            <div id="node_list_body" style="margin-top: 8px;"></div>
        </div>
    </div>
    <p></p>
</div>

<!-- Hidden node row templates -->
<table id="node_row_templates" style="display: none;">
    <tbody>
    <tr id="node_header_template" class="mdui-typo-caption-opacity">
        <td style="width: 8%;">序号</td>
        <td style="width: 37%;">名称</td>
        <td style="width: 30%;">地址</td>
        <td style="width: 10%;">延迟</td>
        <td style="width: 15%;">操作</td>
    </tr>
    <tr id="node_template">
        <td class="node_index"></td>
        <td class="node_name" style="white-space: nowrap;"></td>
        <td class="node_addr"></td>
        <td class="node_delay"></td>
        <td>
            <div style="display: flex; gap: 8px; justify-content: flex-start;">
                <div class="mdui-chip apply_node" title="应用节点">
                    <span class="mdui-chip-icon mdui-color-green-500"><i class="mdui-icon material-icons">check</i></span>
                </div>
                <div class="mdui-chip favorite_node" title="添加到收藏">
                    <span class="mdui-chip-icon mdui-color-grey-400"><i class="mdui-icon material-icons">star_border</i></span>
                </div>
                <div class="mdui-chip get_node_link" title="拷贝链接">
                    <span class="mdui-chip-icon mdui-color-blue-500"><i class="mdui-icon material-icons">links</i></span>
                </div>
                <div class="mdui-chip get_node_qr" title="获取二维码">
                    <span class="mdui-chip-icon mdui-color-grey-500"><i class="mdui-icon material-icons">crop_free</i></span>
                </div>
                <div class="mdui-chip delete_node" title="删除节点">
                    <span class="mdui-chip-icon mdui-color-red-500"><i class="mdui-icon material-icons">delete</i></span>
                </div>
            </div>
        </td>
    </tr>
    </tbody>
</table>

<div id="qr_toast" class="mdui-dialog">
    <div class="mdui-dialog-content">
        <div id="qr_code" style="width: fit-content"></div>
    </div>
</div>

        display: inline-block;

        transform: rotate(180deg);
    }

        position: relative;
    }

        content: '';

        top: 4px;
        left: 4px;
        right: 4px;
        bottom: 4px;
        background: rgba(255, 152, 0, 0.15);
        border-radius: 8px;
        pointer-events: none;
    }
    .node_running td.node_name {
        text-align: left;
    }
    .node_running .apply_node .mdui-chip-icon {
        color: white !important;
        background-color: #FF9800 !important;
    }
    .subscribe-index {
        display: inline-block;
        background-color: rgba(0, 0, 0, 0.1);

        background-color: #FF9800;

        border-color: #1976d2;
        background-color: rgba(25, 118, 210, 0.08);

    .node-type-vless {
        color: #7b1fa2;
        border-color: #7b1fa2;
        background-color: rgba(123, 31, 162, 0.08);
    }
    .node-type-anytls {
        color: #0097a7;
        border-color: #0097a7;
        background-color: rgba(0, 151, 167, 0.08);
    }
    .node-type-hy2 {
        color: #2e7d32;
        border-color: #2e7d32;
        background-color: rgba(46, 125, 50, 0.08);
    }
    .node-type-ss {
        color: #e91e63;
        border-color: #e91e63;
        background-color: rgba(233, 30, 99, 0.08);
    }
</style>

<script src="/static/js/qrcode.js"></script>
<script src="/static/js/jquery.qrcode.js"></script>
<script type="text/javascript">
    //# sourceURL=subscribe.js

    $(document).ready(function () {
        mdui.mutation();

        // All dynamic rows (subscribe heads, manual head, node rows) live in #node_list_body
        $("#node_list_body").on("click", ".toggle-row", function() {
            var groupIndex = $(this).closest("tr").data("group");
            var $nodesBody = $(".group-" + groupIndex);
            var $icon = $(this).find(".group-toggle");
            if ($nodesBody.is(":visible")) {
                $nodesBody.slideUp(200);
                $icon.removeClass("expanded");
            } else {
                $nodesBody.slideDown(200);
                $icon.addClass("expanded");
            }
            return false;
        });

        $("#node_list_body").on("click", ".update_subscribe", function() {
            update_subscribe($(this).closest("tr").data("url"));
        });

        $("#node_list_body").on("click", ".remove_subscribe", function() {
            remove_subscribe($(this).closest("tr").data("url"));
        });

        $("#node_list_body").on("click", ".copy_url", function() {
            var url = $(this).closest("tr").data("url");
            if (copy_to_clipboard(url)) {
                message("订阅地址已复制");
            }
        });

        $("#node_list_body").on("click", ".show_subscribe_qr", function() {
            var url = $(this).closest("tr").data("url");
            show_qr_code(url);
        });

        $("#node_list_body").on("click", ".apply_node", function() {
            var row = $(this).closest("tr");
            apply_node(row.data("url"), row.data("index"));
        });

        $("#node_list_body").on("click", "tr[data-url]", function(e) {
            if ($(e.target).closest(".mdui-chip").length) return;
            if ($(this).data("index") === undefined) return;
            if ($(this).hasClass("node_running")) return;
            var row = $(this);
            var url = row.data("url");
            var index = row.data("index");
            var nodeName = row.find(".node-name-text").text();
            mdui.confirm("切换到节点：" + nodeName + " ？", function() {
                apply_node(url, index);
            }, function() {}, { title: "切换节点", confirmText: "确认", cancelText: "取消" });
        });

        $("#node_list_body").on("click", ".get_node_link", function() {
            var row = $(this).closest("tr");
            get_node_link(row.data("url"), row.data("index"));
        });

        $("#node_list_body").on("click", ".get_node_qr", function() {
            var row = $(this).closest("tr");
            get_node_qr(row.data("url"), row.data("index"));
        });

        $("#node_list_body").on("click", ".delete_node", function() {
            var row = $(this).closest("tr");
            delete_node(row.data("url"), row.data("index"));
        });

        $("#node_list_body").on("click", ".favorite_node", function() {
            var row = $(this).closest("tr");
            favorite_node(row.data("url"), row.data("index"), $(this));
        });

        refresh();
    });

    function refresh() {
        ajax_request({ url: "/subscribe_list" }).then(function (subscribe) {
            $("#last_subscribe").html(subscribe["last_subscribe"]);
            var groups = Object.values(subscribe["subscribes"]);
            if (groups.length === 0) {
                $("#update_all_subscribe").hide();
                $("#ping_test").hide();
            } else {
                $("#update_all_subscribe").show();
                $("#ping_test").show();
            }

            var node_running = subscribe["ps"];
            var favoriteNames = (subscribe["manual_nodes"] || []).map(function(n) { return n["ps"]; });
            var nodeListBody = $("#node_list_body");
            nodeListBody.empty();
            var currentNodesDiv = null;
            var currentNodesTbody = null;

            function make_group_head(url, index) {
                var url_row = $("#subscribe_template").clone();
                url_row.attr("id", "real_subscribe_" + index);
                url_row.attr("data-url", url);
                url_row.attr("data-group", index);
                url_row.find(".url").html(url);
                url_row.find(".subscribe-index").html("订阅 " + index);
                url_row.find(".group-toggle").addClass("expanded");
                url_row.show();
                var headerTable = $('<table class="mdui-table" style="margin-top: 4px;"><tbody></tbody></table>');
                headerTable.find("tbody").append(url_row);
                var nodesTable = $('<table class="mdui-table"><tbody></tbody></table>');
                var nodesDiv = $('<div class="group-' + index + '" style="display:none;"></div>').append(nodesTable);
                nodeListBody.append($('<div></div>').append(headerTable).append(nodesDiv));
                currentNodesDiv = nodesDiv;
                currentNodesTbody = nodesTable.find("tbody");
            }

            function make_manual_head(groupIndex) {
                var manual_head = $("#manual_template").clone();
                manual_head.attr("id", "real_manual");
                manual_head.attr("data-group", groupIndex);
                manual_head.find(".group-toggle").addClass("expanded");
                manual_head.show();
                var headerTable = $('<table class="mdui-table"><tbody></tbody></table>');
                headerTable.find("tbody").append(manual_head);
                var nodesTable = $('<table class="mdui-table"><tbody></tbody></table>');
                var nodesDiv = $('<div class="group-' + groupIndex + '" style="display:none;"></div>').append(nodesTable);
                nodeListBody.append($('<div></div>').append(headerTable).append(nodesDiv));
                currentNodesDiv = nodesDiv;
                currentNodesTbody = nodesTable.find("tbody");
            }

            function make_node_head(groupIndex) {
                var node_head_row = $("#node_header_template").clone();
                node_head_row.attr("id", "real_header_" + groupIndex);
                currentNodesTbody.append(node_head_row);
            }

            function protocol_badge(protocol) {
                protocol = (protocol || "vmess").toLowerCase();
                if (protocol === "hysteria2") {
                    return { label: "hy2", className: "hy2" };
                }
                return { label: protocol, className: protocol };
            }

            function make_node_row(url, node_data, groupIndex, nodeIndex, isFavorite) {
                var node_row = $("#node_template").clone();
                node_row.attr("id", "real_node_" + groupIndex + "_" + nodeIndex);
                node_row.attr("data-url", url);
                node_row.attr("data-index", nodeIndex);
                node_row.find(".node_index").html(nodeIndex + 1);
                if (isFavorite) {
                    node_row.find(".favorite_node").hide();
                } else if (favoriteNames.indexOf(node_data["ps"]) !== -1) {
                    node_row.find(".favorite_node .mdui-icon").html("star");
                    node_row.find(".favorite_node .mdui-chip-icon").removeClass("mdui-color-grey-400").addClass("mdui-color-yellow-700");
                }
                var badge = protocol_badge(node_data["protocol"]);
                var typeBadge = '<span class="node-type-badge node-type-' + badge.className + '">' + badge.label + '</span>';
                node_row.find(".node_name").attr("data-ps", node_data["ps"]).html(typeBadge + ' <span class="node-name-text">' + node_data["ps"] + '</span>');
                node_row.find(".node_addr").html(node_data["add"]);
                if (node_data["ps"] === node_running) {
                    node_row.addClass("node_running");
                    node_row.find(".apply_node .mdui-icon").html("vpn_key");
                }
                currentNodesTbody.append(node_row);
                currentNodesDiv.show();
            }

            // Render favorites first
            var manualGroup = groups.length + 1;
            make_manual_head(manualGroup);
            var manuals = subscribe["manual_nodes"];
            if (manuals.length > 0) {
                make_node_head(manualGroup);
                manuals.forEach(function(node_data, j) {
                    make_node_row('manual', node_data, manualGroup, j, true);
                });
            }

            groups.forEach(function(group, i) {
                var url = group["subscribe"];
                var index = i + 1;
                make_group_head(url, index);
                make_node_head(index);
                group["nodes"].forEach(function(node_data, j) {
                    make_node_row(url, node_data, index, j, false);
                });
            });

            update_ping_result();

            if (node_running) {
                var runningRow = $(".node_running");
                if (runningRow.length > 0) {
                    var nodeUrl = runningRow.data("url");
                    if (nodeUrl === 'manual') {
                        $("#real_manual .subscribe-index").addClass("running");
                        var ps = runningRow.find(".node_name").data("ps");
                        if (ps) {
                            $("#node_list_body tr").filter(function() {
                                return $(this).data("url") !== 'manual' && $(this).find(".node_name").data("ps") === ps;
                            }).addClass("node_running").find(".apply_node .mdui-icon").html("vpn_key");
                        }
                    } else {
                        $("#node_list_body tr").filter(function() {
                            return $(this).data("url") === nodeUrl;
                        }).find(".subscribe-index").addClass("running");
                    }
                }
            }
        });
    }

    function apply_node(url, index) {
        pop_toast("正在应用节点...");
        ajax_request({ url: "/apply_node", data: {subscribe: url, node_index: index} }).then(function(data) {
            if (check_result(data)) {
                update_toast("应用成功");
                if (typeof update_header_status === "function") {
                    update_header_status(data);
                } else if (typeof refresh_header_status === "function") {
                    refresh_header_status();
                }
                $(".node_running").removeClass("node_running").find(".apply_node .mdui-icon").html("check");
                $(".subscribe-index").removeClass("running");

                var current_node = $("#node_list_body tr").filter(function() {
                    return $(this).data("url") === url && $(this).data("index") === index;
                });
                current_node.addClass("node_running");
                current_node.find(".apply_node .mdui-icon").html("vpn_key");

                if (url === "manual") {
                    $("#real_manual .subscribe-index").addClass("running");
                    var ps = current_node.find(".node_name").data("ps");
                    if (ps) {
                        $("#node_list_body tr").filter(function() {
                            return $(this).data("url") !== 'manual' && $(this).find(".node_name").data("ps") === ps;
                        }).addClass("node_running").find(".apply_node .mdui-icon").html("vpn_key");
                    }
                } else {
                    $("#node_list_body tr").filter(function() {
                        return $(this).data("url") === url;
                    }).find(".subscribe-index").addClass("running");
                }
            } else {
                update_toast("应用失败");
            }
        }).always(function() {
            close_toast();
        });
    }
    
    function get_node_link(url, index) {
        ajax_request({ url: "/get_node_link", data: {subscribe:url, node_index:index} }).then(function (data) {
            if (check_result(data)) {
                link = data["node_link"];
                copy_to_clipboard(link);
                message("链接已复制到剪贴板");
            }
        })
    }

    function get_node_qr(url, index) {
        ajax_request({ url: "/get_node_link", data: {subscribe:url, node_index:index} }).then(function (data) {
            if (check_result(data)) {
                link = data["node_link"];
                show_qr_code(link);
            }
        })
    }

    function show_qr_code(text) {
        $("#qr_code").empty().qrcode(text);
        toast = new mdui.Dialog("#qr_toast", { destroyOnClosed:true });
        toast.open();
        mdui.mutation();
    }

    function favorite_node(url, index, $btn) {
        ajax_request({ url: "/favorite_node", data: {subscribe: url, node_index: index} }).then(function(data) {
            if (check_result(data)) {
                message("已添加到收藏");
                refresh();
            } else {
                message("已在收藏中");
            }
        });
    }

    function delete_node(url, index) {
        mdui.confirm("确认删除？", function () {
            ajax_request({ url: "/delete_node", data: {subscribe:url, node_index:index} }).then(function (data) {
                if (check_result(data)) {
                    message("节点已删除");
                    refresh();
                }
            })
        });
    }

    function update_subscribe(url) {
        pop_toast("正在更新订阅节点...")
        ajax_request({ url: "/update_subscribe", data: {subscribe:url} }).then(function (data) {
            if (check_result(data)) {
                update_toast("更新成功");
            }
            else {
                update_toast("更新失败");
            }
        }).always(function () {
            close_toast();
            refresh();
        });
    }

    function update_all_subscribe() {
        pop_toast("正在更新订阅节点...")
        ajax_request({ url: "/update_all_subscribe" }).then(function (data) {
            if (check_result(data)) {
                update_toast("更新成功");
            }
            else {
                update_toast("更新失败");
            }
        }).always(function () {
            close_toast();
            refresh();
        });
    }

    function add_subscribe() {
        mdui.prompt("请输入订阅地址：<br><small style='color:#888'>支持 V2rayN base64 格式和 Clash YAML 格式</small>", function (url) {
            if (!url.length) {
                return;
            }
            pop_toast("正在订阅新的节点列表...");
            ajax_request({ url: "/add_subscribe", data: {subscribe:url} }).then(function (data) {
                if (check_result(data)) {
                    update_toast("订阅成功");
                }
                else {
                    update_toast("订阅失败");
                }
            }).always(function () {
                close_toast();
                refresh();
            });
        });
    }

    function add_manual_node() {
        mdui.prompt("请输入节点链接：<br><small style='color:#888'>支持 vmess://, vless://, ss://, anytls://, hysteria2://, hy2://</small>", function (url) {
            if (!url.length) {
                return;
            }
            message("正在添加新的节点列表...");
            ajax_request({ url: "/add_manual_node", data: {url:url} }).then(function (data) {
                if (check_result(data)) {
                    message("添加成功");
                }
                else {
                    message("添加失败");
                }
            }).always(function () {
                refresh();
            });
        });
    }

    function remove_subscribe(url) {
        mdui.confirm("确认删除？", function () {
            ajax_request({ url: "/remove_subscribe", data: {subscribe:url} }).then(function (data) {
                if (check_result(data)) {
                    message("订阅已删除");
                    refresh();
                }
            })
        });
    }

    function ping_test() {
        message("正在测试，请稍候...")
        ajax_request({ url: "/subscribe_ping_all" }).then(function (data) {
            window.g_ping_cache = data["groups"];
            update_ping_result();
            message("测试完成")
        });
    }

    function update_ping_result() {
        if (window.g_ping_cache === undefined)
            return;
        window.g_ping_cache.forEach(function (group) {
            list = group["nodes"];
            url = group["subscribe"];
            $("#node_list_body tr").filter(function() {
                return $(this).data("url") === url;
            }).each(function (index, row) {
                node_name = $(row).find(".node_name").attr("data-ps");
                delay = list[node_name];

                td = $(row).find(".node_delay");
                td.removeClass("mdui-text-color-red");
                td.removeClass("mdui-text-color-green");

                var content = "";
                if (delay !== undefined) {
                    if (-1 === delay) {
                        content = "☹";
                        td.addClass("mdui-text-color-red");
                    }
                    else {
                        content = String(delay) + " ms";
                        td.addClass("mdui-text-color-green");
                    }
                }

                td.html(content);
            });
        });
    }
</script>
