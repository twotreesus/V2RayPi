<style>
    .group-toggle {
        display: inline-block;
        transition: transform 280ms ease-out;
    }
    .group-toggle.expanded {
        transform: rotate(180deg);
    }
    /* Animate group body via grid rows instead of jQuery slide*: JS height
       tweening on large node tables feels stepped; grid interpolates smoothly. */
    .group-nodes {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 280ms ease-out;
    }
    .group-nodes.is-expanded {
        grid-template-rows: 1fr;
    }
    .group-nodes.group-nodes--prep {
        transition: none;
    }
    .group-nodes-inner {
        overflow: hidden;
        min-height: 0;
    }

        position: relative;
    }
    .node_running::after {
        content: '';
        position: absolute;
        top: 4px;
        left: 4px;
        right: 4px;
        bottom: 4px;
        background: rgba(255, 152, 0, 0.15);
        border-radius: 8px;
        pointer-events: none;
    }
    .node_running td.node_name {
        text-align: left;
    }

        flex-shrink: 0;

        line-height: 1;

    /* Swallows the click that dismisses an open menu, so it cannot reach the row

    .actions-overlay {
        position: fixed;
        top: 0;
        right: 0;

    .horizontal-actions-menu.is-open {

<script type="text/javascript">
    //# sourceURL=subscribe.js
    $(document).ready(function () {
        mdui.mutation();

        // All dynamic rows (subscribe heads, manual head, node rows) live in #node_list_body
        $("#node_list_body").on("click", ".toggle-row", function(e) {
            if ($(e.target).closest(".rename_subscribe").length) {
                return;
            }
            var $head = $(this).closest("tr");
            var groupIndex = $head.data("group");
            var groupKey = $head.attr("data-group-key");
            var $nodesBody = $(".group-" + groupIndex);
            var $icon = $(this).find(".group-toggle");
            var expanding = !$nodesBody.hasClass("is-expanded");
            $nodesBody.toggleClass("is-expanded", expanding);
            $icon.toggleClass("expanded", expanding);
            save_group_expand_state(groupKey, expanding);
            return false;
        });

        $("#node_list_body").on("click", ".rename_subscribe", function(e) {
            e.stopPropagation();
            var row = $(this).closest("tr");
            rename_subscribe(row.data("url"), row.find(".subscribe-index-label").text());
            return false;
        });

        $("#node_list_body").on("click", ".update_subscribe", function() {
            close_horizontal_action_menus();
            update_subscribe($(this).closest("tr").data("url"));
        });

        $("#node_list_body").on("click", ".remove_subscribe", function() {
            close_horizontal_action_menus();
            remove_subscribe($(this).closest("tr").data("url"));
        });

        $("#node_list_body").on("click", ".copy_url", function() {
            var url = $(this).closest("tr").data("url");
            close_horizontal_action_menus();
            if (copy_to_clipboard(url)) {
                message(t("subscribe.url_copied"));
            }
        });

        $("#node_list_body").on("click", ".show_subscribe_qr", function() {
            var url = $(this).closest("tr").data("url");
            close_horizontal_action_menus();
            show_qr_code(url);
        });

        $("#node_list_body").on("click", "tr[data-url]", function(e) {
            if ($(e.target).closest(".mdui-chip, .horizontal-actions-menu").length) return;
            if ($(this).data("index") === undefined) return;
            if ($(this).hasClass("node_running")) return;
            var row = $(this);
            var url = row.data("url");
            var index = row.data("index");
            var nodeName = row.find(".node-name-label").text() || row.find(".node_name").data("ps");
            mdui.confirm(t("subscribe.switch.prompt", {name: nodeName}), t("subscribe.switch.title"), function() {
                apply_node(url, index);
            }, function() {}, {
                confirmText: t("subscribe.confirm"),
                cancelText: t("subscribe.cancel")
            });
        });

        $("#node_list_body").on("click", ".node_actions, .subscribe_actions", function(e) {
            e.stopPropagation();
            var menu = $(this).siblings(".horizontal-actions-menu");
            var shouldOpen = !menu.hasClass("is-open");
            close_horizontal_action_menus();
            if (!shouldOpen) return;

            var anchorRect = this.getBoundingClientRect();
            // The menu hangs to the left of the button. Measure its unscaled width
            // (transforms do not affect scrollWidth) and shrink it so the whole
            // strip fits between the screen's left inset and the button.
            var gap = 8;
            var leftInset = 16;
            var naturalWidth = menu[0].scrollWidth;
            var available = Math.max(0, anchorRect.left - gap - leftInset);
            var scale = naturalWidth > 0 ? Math.min(1, available / naturalWidth) : 1;
            // Pin --menu-scale while still closed (with transitions off) so the
            // open animation only slides/squeezes from the right and does not
            // also shrink from full size on a narrow screen.
            menu.css({
                transition: "none",
                top: anchorRect.top + anchorRect.height / 2,
                right: window.innerWidth - anchorRect.left + gap,
                left: "auto",
                "--menu-scale": scale
            });
            menu[0].offsetWidth;
            menu.css("transition", "");
            menu.addClass("is-open");
            $("#actions_overlay").addClass("is-open");
        });

        $("#node_list_body").on("click", ".get_node_link", function() {
            var row = $(this).closest("tr");
            close_horizontal_action_menus();
            get_node_link(row.data("url"), row.data("index"));
        });

        $("#node_list_body").on("click", ".show_node_qr", function() {
            var row = $(this).closest("tr");
            close_horizontal_action_menus();
            show_node_qr(row.data("url"), row.data("index"));
        });

        $("#node_list_body").on("click", ".delete_node", function() {
            var row = $(this).closest("tr");
            close_horizontal_action_menus();
            delete_node(row.data("url"), row.data("index"));
        });

        $("#node_list_body").on("click", ".favorite_node", function() {
            var row = $(this).closest("tr");
            close_horizontal_action_menus();
            favorite_node(row.data("url"), row.data("index"));
        });

        $(document)
            .off("click.nodeActions")
            .on("click.nodeActions", function(e) {
                if (!$(e.target).closest(".node_actions, .subscribe_actions, .horizontal-actions-menu").length) {
                    close_horizontal_action_menus();
                }
            });

        refresh();
    });

    var GROUP_EXPAND_STORAGE_KEY = "v2raypi.subscribe.groupExpanded";

    function load_group_expand_state() {
        try {
            var raw = localStorage.getItem(GROUP_EXPAND_STORAGE_KEY);
            var parsed = raw ? JSON.parse(raw) : {};
            return parsed && typeof parsed === "object" ? parsed : {};
        } catch (e) {
            return {};
        }
    }

    function save_group_expand_state(groupKey, expanded) {
        if (!groupKey) {
            return;
        }
        var state = load_group_expand_state();
        state[groupKey] = !!expanded;
        try {
            localStorage.setItem(GROUP_EXPAND_STORAGE_KEY, JSON.stringify(state));
        } catch (e) {
            // Quota / private mode: keep the session usable without persistence.
        }
    }

    function is_group_expanded(groupKey, hasNodes) {
        if (!hasNodes) {
            return false;
        }
        var state = load_group_expand_state();
        if (Object.prototype.hasOwnProperty.call(state, groupKey)) {
            return !!state[groupKey];
        }
        // First visit: keep groups open, matching the previous default.
        return true;
    }

    function close_horizontal_action_menus() {
        // Leave --menu-scale alone so the close animation stays a right-edge
        // slide; the next open pins a fresh scale with transitions disabled.
        $(".horizontal-actions-menu.is-open").removeClass("is-open");
        $("#actions_overlay").removeClass("is-open");
    }

    function refresh() {
        ajax_request({ url: "/subscribe_list" }).then(function (subscribe) {
            $("#last_subscribe").html(subscribe["last_subscribe"]);
            var groups = Object.values(subscribe["subscribes"]);
            if (groups.length === 0) {
                $("#update_all_subscribe").hide();
            } else {
                $("#update_all_subscribe").show();
            }

            var node_running = subscribe["ps"];
            var favoriteNames = (subscribe["manual_nodes"] || []).map(function(n) { return n["ps"]; });
            var nodeListBody = $("#node_list_body");
            nodeListBody.empty();
            var currentNodesDiv = null;
            var currentNodesTbody = null;
            var currentHeadRow = null;
            var currentGroupKey = null;
            var currentHasNodes = false;

            function finalize_current_group() {
                if (!currentNodesDiv || !currentHeadRow) {
                    return;
                }
                var expanded = is_group_expanded(currentGroupKey, currentHasNodes);
                currentNodesDiv.toggleClass("is-expanded", expanded);
                currentHeadRow.find(".group-toggle").toggleClass("expanded", expanded);
            }

            function subscribe_display_name(group) {
                var name = group && group.name ? String(group.name).trim() : "";
                if (name) {
                    return name;
                }
                var url = (group && group.subscribe) || "";
                try {
                    return new URL(url).hostname || url;
                } catch (e) {
                    return url;
                }
            }

            var airportByUrl = {};
            var airportByPs = {};
            groups.forEach(function(group) {
                var airport = subscribe_display_name(group);
                if (group.subscribe) {
                    airportByUrl[group.subscribe] = airport;
                }
                (group.nodes || []).forEach(function(node) {
                    if (node.ps) {
                        airportByPs[node.ps] = airport;
                    }
                });
            });

            function favorite_airport_name(node_data) {
                return (node_data.subscribe && airportByUrl[node_data.subscribe])
                    || (node_data.airport || "").trim()
                    || airportByPs[node_data.ps]
                    || "";
            }

            function make_group_head(group, index) {
                var url = group.subscribe;
                var url_row = $("#subscribe_template").clone();
                url_row.attr("id", "real_subscribe_" + index);
                url_row.attr("data-url", url);
                url_row.attr("data-group", index);
                url_row.attr("data-group-key", url);
                url_row.find(".subscribe-index-label").text(subscribe_display_name(group));
                url_row.find(".url").text(url);
                I18n.apply(url_row[0]);
                url_row.show();
                var headerTable = $('<table class="mdui-table node-table"><tbody></tbody></table>');
                headerTable.find("tbody").append(url_row);
                var nodesTable = $('<table class="mdui-table node-table"><tbody></tbody></table>');
                var nodesInner = $('<div class="group-nodes-inner"></div>').append(nodesTable);
                var nodesDiv = $('<div class="group-' + index + ' group-nodes group-nodes--prep"></div>')
                    .attr("data-group-key", url)
                    .append(nodesInner);
                nodeListBody.append($('<div></div>').append(headerTable).append(nodesDiv));
                currentNodesDiv = nodesDiv;
                currentHeadRow = url_row;
                currentGroupKey = url;
                currentHasNodes = false;
                currentNodesTbody = nodesTable.find("tbody");
            }

            function make_manual_head(groupIndex) {
                var manual_head = $("#manual_template").clone();
                manual_head.attr("id", "real_manual");
                manual_head.attr("data-group", groupIndex);
                manual_head.attr("data-group-key", "manual");
                I18n.apply(manual_head[0]);
                manual_head.show();
                var headerTable = $('<table class="mdui-table node-table"><tbody></tbody></table>');
                headerTable.find("tbody").append(manual_head);
                var nodesTable = $('<table class="mdui-table node-table"><tbody></tbody></table>');
                var nodesInner = $('<div class="group-nodes-inner"></div>').append(nodesTable);
                var nodesDiv = $('<div class="group-' + groupIndex + ' group-nodes group-nodes--prep"></div>')
                    .attr("data-group-key", "manual")
                    .append(nodesInner);
                nodeListBody.append($('<div></div>').append(headerTable).append(nodesDiv));
                currentNodesDiv = nodesDiv;
                currentHeadRow = manual_head;
                currentGroupKey = "manual";
                currentHasNodes = false;
                currentNodesTbody = nodesTable.find("tbody");
            }

            function protocol_badge(protocol) {
                // The protocol comes straight from the Clash `type` field, so any type
                // mihomo supports can show up here.  Only a few get their own colour;
                // the rest share a neutral badge instead of an undefined class.
                protocol = (protocol || "").toLowerCase();
                var labels = { hysteria2: "hy2", hysteria: "hy1", socks5: "socks", wireguard: "wg" };
                var styled = ["vmess", "vless", "ss", "anytls", "mieru", "trojan", "tuic", "hy2"];
                var label = labels[protocol] || protocol || "unknown";
                var className = styled.indexOf(label) !== -1 ? label : "other";
                return { label: label, className: className };
            }

            function make_node_row(url, node_data, groupIndex, nodeIndex, isFavorite) {
                var node_row = $("#node_template").clone();
                node_row.attr("id", "real_node_" + groupIndex + "_" + nodeIndex);
                node_row.attr("data-url", url);
                node_row.attr("data-index", nodeIndex);
                node_row.data("favorite", isFavorite);
                if (isFavorite) {
                    node_row.find(".favorite_node").hide();
                    node_row.find(".delete_node .delete-node-label")
                        .attr("data-i18n", "subscribe.action.unfavorite")
                        .text(t("subscribe.action.unfavorite"));
                    node_row.find(".delete_node")
                        .attr("data-i18n-title", "subscribe.tooltip.remove_favorite")
                        .attr("title", t("subscribe.tooltip.remove_favorite"));
                    node_row.find(".delete_node .mdui-icon").html("star");
                    node_row.find(".delete_node .mdui-chip-icon")
                        .removeClass("mdui-color-red-500")
                        .addClass("mdui-color-yellow-700");
                } else if (favoriteNames.indexOf(node_data["ps"]) !== -1) {
                    node_row.find(".favorite_node .mdui-icon").html("star");
                    node_row.find(".favorite_node .mdui-chip-icon")
                        .removeClass("mdui-color-grey-400")
                        .addClass("mdui-color-yellow-700");
                }
                var badge = protocol_badge(node_data["protocol"]);
                var typeBadge = '<span class="node-type-badge node-type-' + badge.className + '">' + badge.label + '</span>';
                node_row.find(".node-protocol").html(typeBadge);
                node_row.find(".node_name").attr("data-ps", node_data["ps"]);
                var name = node_data["ps"] || "";
                if (isFavorite) {
                    var airport = favorite_airport_name(node_data);
                    if (airport && name) {
                        name = airport + " | " + name;
                    }
                }
                node_row.find(".node-name-label").text(name);
                node_row.find(".node_addr").html(node_data["add"]);
                if (node_data["ps"] === node_running) {
                    node_row.addClass("node_running");
                }
                currentNodesTbody.append(node_row);
                currentHasNodes = true;
            }

            // Render favorites first
            var manualGroup = groups.length + 1;
            make_manual_head(manualGroup);
            var manuals = subscribe["manual_nodes"];
            if (manuals.length > 0) {
                manuals.forEach(function(node_data, j) {
                    make_node_row('manual', node_data, manualGroup, j, true);
                });
            }
            finalize_current_group();

            groups.forEach(function(group, i) {
                var url = group["subscribe"];
                var index = i + 1;
                make_group_head(group, index);
                group["nodes"].forEach(function(node_data, j) {
                    make_node_row(url, node_data, index, j, false);
                });
                finalize_current_group();
            });

            // Enable expand/collapse transitions only after the initial layout is
            // painted, so rebuilding the list does not animate every group open.
            requestAnimationFrame(function () {
                nodeListBody.find(".group-nodes--prep").removeClass("group-nodes--prep");
            });

            function unify_badge_widths(selector) {
                var badges = nodeListBody.find(selector);
                badges.css("width", "");
                if (badges.length < 2) {
                    return;
                }
                var max = 0;
                badges.each(function() {
                    max = Math.max(max, this.getBoundingClientRect().width);
                });
                badges.css("width", Math.ceil(max) + "px");
            }

            function unify_subscribe_name_widths() {
                unify_badge_widths(".subscription-row .subscribe-index, .favorite-row .subscribe-index");
            }

            if (node_running) {
                var runningRow = $(".node_running");
                if (runningRow.length > 0) {
                    var nodeUrl = runningRow.data("url");
                    if (nodeUrl === 'manual') {
                        $("#real_manual .subscribe-index").addClass("running");
                        var ps = runningRow.find(".node_name").data("ps");
                        if (ps) {
                            $("#node_list_body tr").filter(function() {
                                return $(this).data("url") !== 'manual' && $(this).find(".node_name").data("ps") === ps;
                            }).addClass("node_running");
                        }
                    } else {
                        $("#node_list_body tr").filter(function() {
                            return $(this).data("url") === nodeUrl;
                        }).find(".subscribe-index").addClass("running");
                    }
                }
            }

            unify_subscribe_name_widths();
        });
    }

    function apply_node(url, index) {
        pop_toast(t("subscribe.apply.in_progress"));
        ajax_request({ url: "/apply_node", data: {subscribe: url, node_index: index} }).then(function(data) {
            if (check_result(data)) {
                update_toast(t("subscribe.apply.success"));
                if (typeof update_header_status === "function") {
                    update_header_status(data);
                } else if (typeof refresh_header_status === "function") {
                    refresh_header_status();
                }
                $(".node_running").removeClass("node_running");
                $(".subscribe-index").removeClass("running");

                var current_node = $("#node_list_body tr").filter(function() {
                    return $(this).data("url") === url && $(this).data("index") === index;
                });
                current_node.addClass("node_running");

                if (url === "manual") {
                    $("#real_manual .subscribe-index").addClass("running");
                    var ps = current_node.find(".node_name").data("ps");
                    if (ps) {
                        $("#node_list_body tr").filter(function() {
                            return $(this).data("url") !== 'manual' && $(this).find(".node_name").data("ps") === ps;
                        }).addClass("node_running");
                    }
                } else {
                    $("#node_list_body tr").filter(function() {
                        return $(this).data("url") === url;
                    }).find(".subscribe-index").addClass("running");
                }
                // Warm the egress-IP cache after the node change; Status will
                // pick up the fresh result without waiting on the TTL.
                ajax_request({ url: "/get_egress_ip?force=1" });
            } else {
                update_toast(t("subscribe.apply.failed"));
            }
        }).always(function() {
            close_toast();
        });
    }
    
    function get_node_link(url, index) {
        ajax_request({ url: "/get_node_link", data: {subscribe:url, node_index:index} }).then(function (data) {
            if (check_result(data)) {
                link = data["node_link"];
                copy_to_clipboard(link);
                message(t("subscribe.link_copied"));
            } else {
                message(I18n.apiError(data, "subscribe.link_unavailable"));
            }
        })
    }

    function show_node_qr(url, index) {
        ajax_request({ url: "/get_node_link", data: {subscribe:url, node_index:index} }).then(function (data) {
            if (check_result(data)) {
                show_qr_code(data["node_link"]);
            } else {
                message(I18n.apiError(data, "subscribe.qr_unavailable"));
            }
        })
    }

    function show_qr_code(text) {
        $("#qr_code").empty().qrcode(text);
        toast = new mdui.Dialog("#qr_toast", { destroyOnClosed:true });
        toast.open();
        mdui.mutation();
    }

    function favorite_node(url, index) {
        ajax_request({ url: "/favorite_node", data: {subscribe: url, node_index: index} }).then(function(data) {
            if (check_result(data)) {
                message(t("subscribe.favorite.added"));
                refresh();
            } else {
                message(t("subscribe.favorite.exists"));
            }
        });
    }

    function delete_node(url, index) {
        var isFavorite = url === "manual";

        function request_delete() {
            ajax_request({ url: "/delete_node", data: {subscribe:url, node_index:index} }).then(function (data) {
                if (check_result(data)) {
                    message(isFavorite ? t("subscribe.favorite.removed") : t("subscribe.node.deleted"));
                    refresh();
                }
            })
        }

        if (isFavorite) {
            request_delete();
            return;
        }

        mdui.confirm(t("subscribe.node.confirm_delete"), t("subscribe.node.delete_title"), function () {
            request_delete();
        }, function () {}, {
            confirmText: t("subscribe.confirm"),
            cancelText: t("subscribe.cancel")
        });
    }

    function rename_subscribe(url, currentName) {
        mdui.prompt(t("subscribe.prompt.rename"), t("subscribe.prompt.rename_title"), function (name) {
            name = (name || "").trim();
            if (!name.length) {
                return;
            }
            ajax_request({ url: "/rename_subscribe", data: {subscribe: url, name: name} }).then(function (data) {
                if (check_result(data)) {
                    message(t("subscribe.rename.success"));
                    refresh();
                } else {
                    message(t("subscribe.rename.failed"));
                }
            });
        }, function () {}, {
            confirmText: t("subscribe.confirm"),
            cancelText: t("subscribe.cancel"),
            defaultValue: String(currentName || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;")
        });
    }

    function update_subscribe(url) {
        pop_toast(t("subscribe.update.in_progress"))
        ajax_request({ url: "/update_subscribe", data: {subscribe:url} }).then(function (data) {
            if (check_result(data)) {
                update_toast(t("subscribe.update.success"));
            }
            else {
                update_toast(t("subscribe.update.failed"));
            }
        }).always(function () {
            close_toast();
            refresh();
        });
    }

    function update_all_subscribe() {
        pop_toast(t("subscribe.update.in_progress"))
        ajax_request({ url: "/update_all_subscribe" }).then(function (data) {
            if (check_result(data)) {
                update_toast(t("subscribe.update.success"));
            }
            else {
                update_toast(t("subscribe.update.failed"));
            }
        }).always(function () {
            close_toast();
            refresh();
        });
    }

    var g_add_subscribe_dialog = null;

    function add_subscribe() {
        $("#add_subscribe_url").val("");
        $("#add_subscribe_name").val("");
        if (!g_add_subscribe_dialog) {
            g_add_subscribe_dialog = new mdui.Dialog("#add_subscribe_dialog", { history: false });
            $("#add_subscribe_dialog").on("keydown", "input", function (e) {
                if (e.key === "Enter") {
                    e.preventDefault();
                    confirm_add_subscribe();
                }
            });
        }
        g_add_subscribe_dialog.open();
        mdui.updateTextFields("#add_subscribe_dialog");
        $("#add_subscribe_name").focus();
    }

    function confirm_add_subscribe() {
        var url = $("#add_subscribe_url").val().trim();
        var name = $("#add_subscribe_name").val().trim();
        if (!url.length) {
            return;
        }
        g_add_subscribe_dialog.close();
        pop_toast(t("subscribe.add.in_progress"));
        ajax_request({ url: "/add_subscribe", data: {subscribe: url, name: name} }).then(function (data) {
            if (check_result(data)) {
                update_toast(t("subscribe.add.success"));
            }
            else {
                update_toast(t("subscribe.add.failed"));
            }
        }).always(function () {
            close_toast();
            refresh();
        });
    }

    function add_manual_node() {
        mdui.prompt(t("subscribe.prompt.node_link"), t("subscribe.prompt.add_node_title"), function (url) {
            url = url.trim();
            if (!url.length) {
                return;
            }
            ajax_request({
                url: "/add_manual_node",
                type: "POST",
                data: JSON.stringify({url: url})
            }).then(function (data) {
                if (check_result(data)) {
                    message(t("subscribe.node.added"));
                    refresh();
                } else {
                    message(I18n.apiError(data, "subscribe.node.invalid_link"));
                }
            });
        }, function () {}, {
            confirmText: t("subscribe.confirm"),
            cancelText: t("subscribe.cancel")
        });
    }

    function remove_subscribe(url) {
        mdui.confirm(t("subscribe.remove.confirm"), t("subscribe.remove.title"), function () {
            ajax_request({ url: "/remove_subscribe", data: {subscribe:url} }).then(function (data) {
                if (check_result(data)) {
                    message(t("subscribe.remove.success"));
                    refresh();
                }
            })
        }, function () {}, {
            confirmText: t("subscribe.confirm"),
            cancelText: t("subscribe.cancel")
        });
    }

</script>
