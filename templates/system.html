<script type="text/javascript">
    //# sourceURL=system.js
    function check_result(data) {
        return data && data["result"] === "ok";
    }

    function refresh() {
        ajax_request({ url: "/get_system_status" })
            .done(function (data) {
                if (check_result(data)) {
                    $("#v2ray_current_ver").html(data["version"]);
                    $("#singbox_current_ver").html(data["singbox_version"]);
                    $("#mieru_current_ver").html(data["mieru_version"]);
                }
            });
        get_v2raypi_recent_commits();
        get_v2raypi_branches();
    }

    function get_v2raypi_branches() {
        ajax_request({ url: '/get_v2raypi_branches' })
            .done(function(response) {
            if (check_result(response)) {
                window.g_v2raypi_current_branch = response.current;
                var select = $('#v2raypi_branch');
                select.empty();
                response.branches.forEach(function(branch) {
                    var label = branch === response.current ? branch + ' (当前)' : branch;
                    select.append($('<option></option>').attr('value', branch).text(label));
                });
                if (response.current) {
                    select.val(response.current);
                }
                mdui.updateSelects();
            }
        });
    }


    function get_v2raypi_recent_commits() {
        ajax_request({ url: '/get_v2raypi_recent_commits' })
            .done(function(response) {
            if (check_result(response)) {
                if (response.last_update) {
                    $('#lastUpdateTime').text(response.last_update);
                }

                var container = $('#recent_commits');
                container.empty();
                response.commits.forEach(function(commit) {
                    var parts = commit.split('|');
                    var date = parts[0];
                    var message = parts[1];
                    var commitDiv = $('<div class="mdui-text-color-theme-text" style="font-family: monospace; display: flex;">' +
                        '<span class="mdui-color-grey-500 mdui-text-color-white" style="padding: 2px 5px; margin-right: 8px; border-radius: 3px; flex-shrink: 0;">' + date + '</span>' +
                        '<span style="border: 1px solid #e0e0e0; padding: 2px 8px; border-radius: 3px; flex-grow: 1;">' + message + '</span>' +
                        '</div>');
                    container.append(commitDiv);
                });
            }
        });
    }

    function check_singbox_new_ver() {
        message("正在查询...");
        ajax_request({ url: "/check_singbox_new_ver" })
            .done(function (data) {
            window.g_singbox_new_version = data["version"];
            $("#singbox_new_ver").html(window.g_singbox_new_version);
            var current = $("#singbox_current_ver").html();
            if (window.g_singbox_new_version === current) {
                message("当前已是最新版本无需更新");
                $("#singbox_check_update").show();
                $("#singbox_update").hide();
            } else {
                message("已发布新版本，点击升级按钮更新");
                $("#singbox_check_update").hide();
                $("#singbox_update").show();
            }
        }).fail(function () {
            message("检查失败");
        });
    }

    function update_singbox() {
        pop_toast("正在升级...");
        ajax_request({ url: "/update_singbox" })
            .done(function (data) {
                if (check_result(data)) {
                    update_toast("升级成功");
                } else {
                    update_toast("升级失败");
                }
            })
            .always(function () {
                close_toast();
                refresh();
                check_singbox_new_ver();
            });
    }

    function check_mieru_new_ver() {
        message("正在查询...");
        ajax_request({ url: "/check_mieru_new_ver" })
            .done(function (data) {
            window.g_mieru_new_version = data["version"];
            $("#mieru_new_ver").html(window.g_mieru_new_version);
            var current = $("#mieru_current_ver").html();
            if (window.g_mieru_new_version === current) {
                message("当前已是最新版本无需更新");
                $("#mieru_check_update").show();
                $("#mieru_update").hide();
            } else {
                message("已发布新版本，点击升级按钮更新");
                $("#mieru_check_update").hide();
                $("#mieru_update").show();
            }
        }).fail(function () {
            message("检查失败");
        });
    }

    function update_mieru() {
        pop_toast("正在升级...");
        ajax_request({ url: "/update_mieru" })
            .done(function (data) {
                if (check_result(data)) {
                    update_toast("升级成功（运行中的 Mieru 将在下次启动时使用新版本）");
                } else {
                    update_toast("升级失败");
                }
            })
            .always(function () {
                close_toast();
                refresh();
                check_mieru_new_ver();
            });
    }

    function check_v2raypi_updates() {
        var branch = $('#v2raypi_branch').val();
        var toast = pop_toast("正在检查更新...");
        ajax_request({ url: "/check_v2raypi_updates", data: { branch: branch } })
            .done(function(response) {
            if (check_result(response)) {
                var container = $('#recent_commits');
                container.empty();
                response.commits.slice().reverse().forEach(function(commit) {
                    var parts = commit.split('|');
                    var date = parts[0];
                    var message = parts[1];
                    var commitDiv = $('<div class="mdui-text-color-theme-text" style="font-family: monospace; display: flex;">' +
                        '<span class="mdui-color-green-300 mdui-text-color-white" style="padding: 2px 5px; margin-right: 8px; border-radius: 3px; flex-shrink: 0;">' + date + '</span>' +
                        '<span style="border: 1px solid #e0e0e0; padding: 2px 8px; border-radius: 3px; flex-grow: 1;">' + message + '</span>' +
                        '</div>');
                    container.prepend(commitDiv);
                });
                if (response.commits.length > 0) {
                    $('#update_btn_v2raypi').show();
                    message("发现新的更新");
                } else {
                    $('#update_btn_v2raypi').hide();
                    get_v2raypi_recent_commits();
                    message("已是最新版本");
                }
            } else {
                message("检查更新失败");
            }
            close_toast();
        });
    }

    function check_v2ray_new_ver() {
        message("正在查询...");
        ajax_request({ url: "/check_v2ray_new_ver" })
            .done(function (data) {
            window.g_new_version = data["version"];
            $("#v2ray_new_ver").html(window.g_new_version)
            var current_version = $("#v2ray_current_ver").html();
            if (window.g_new_version === current_version) {
                message("当前已是最新版本无需更新");
                $("#check_update").show();
                $("#update").hide();
            }
            else {
                message("已发布新版本，点击升级按钮更新");
                $("#check_update").hide();
                $("#update").show();
            }
        }).fail(function () {
            message("检查失败");
        });
    }

    function update_v2ray() {
        pop_toast("正在升级...");
        ajax_request({ url: "/update_v2ray" })
            .done(function (data) {
                if (check_result(data)) {
                    update_toast("升级成功")
                }
                else {
                    update_toast("升级失败")
                }
            })
            .always(function () {
                close_toast();
                refresh();
                check_v2ray_new_ver();
            });
    }

    function update_and_restart_v2raypi() {
        var branch = $('#v2raypi_branch').val();
        var switching = branch && branch !== window.g_v2raypi_current_branch;
        var first_message = switching
            ? '确定要切换到分支 ' + branch + ' 并更新重启服务吗？'
            : '确定要更新并重启服务吗？';
        var second_message = switching
            ? '警告：将切换到分支 ' + branch + '，本地未提交的改动会被丢弃，且服务将会重启，确定继续吗？'
            : '警告：更新过程中服务将会重启，确定继续吗？';
        mdui.confirm(first_message, '更新确认', function(){
            mdui.confirm(second_message, '再次确认', function() {
                pop_toast("正在更新系统...");
                ajax_request({ url: "/update_and_restart_v2raypi", data: { branch: branch } })
                    .done(function (data) {
                    if (check_result(data)) {
                        var countdown = 10;
                        var timer = setInterval(function() {
                            update_toast("更新成功，正在重启服务，" + countdown + " 秒后刷新页面");
                            countdown--;
                            if (countdown < 0) {
                                clearInterval(timer);
                                close_toast();
                                window.location.reload();
                            }
                        }, 1000);
                    }
                    else {
                        update_toast("更新失败");
                        setTimeout(close_toast, 2000);
                    }
                }).fail(function () {
                    update_toast("更新失败");
                    setTimeout(close_toast, 2000);
                });
            });
        });
    }

    function reboot_host() {
        mdui.confirm('确定要重启主机吗？', '重启确认', function(){
            mdui.confirm('警告：重启过程中服务将会停止，确定继续吗？', '再次确认', function() {
                pop_toast("正在重启主机...");
                ajax_request({ url: "/reboot_host" })
                    .done(function (data) {
                    if (check_result(data)) {
                        update_toast("重启命令已发送，请等待主机重启完成");
                        setTimeout(close_toast, 2000);
                    }
                    else {
                        update_toast("重启失败");
                        setTimeout(close_toast, 2000);
                    }
                }).fail(function () {
                    update_toast("重启失败");
                    setTimeout(close_toast, 2000);
                });
            });
        });
    }

    function shutdown_host() {
        mdui.confirm('确定要关闭主机吗？', '关机确认', function(){
            mdui.confirm('警告：关机后需要手动开机才能恢复服务，确定继续吗？', '再次确认', function() {
                pop_toast("正在关闭主机...");
                ajax_request({ url: "/shutdown_host" })
                    .done(function (data) {
                    if (check_result(data)) {
                        update_toast("关机命令已发送，请等待主机完全关闭");
                        setTimeout(close_toast, 2000);
                    }
                    else {
                        update_toast("关机失败");
                        setTimeout(close_toast, 2000);

                    update_toast("关机失败");
                    setTimeout(close_toast, 2000);

    }

    var logEventSource = null;

    function scroll_log_to_bottom(el) {
        var pre = el.closest('pre');
        pre.scrollTop(pre[0].scrollHeight);
    }

    function toggle_log_display(enabled) {
        if (enabled) {
            $('#log-content, #log-content2').show();
            logEventSource = new EventSource('/stream_logs');

            logEventSource.addEventListener('access', function(e) {
                var msg = JSON.parse(e.data);
                var el = $('#log-access-content');
                if (msg.init) {
                    el.html(msg.text.replace(/\n/g, '<br>'));
                } else {
                    el.append(msg.text.replace(/\n/g, '<br>'));
                }
                scroll_log_to_bottom(el);
            });

            logEventSource.addEventListener('xray_error', function(e) {
                var msg = JSON.parse(e.data);
                var el = $('#log-error-content');
                if (msg.init) {
                    el.html(msg.text.replace(/\n/g, '<br>'));
                } else {
                    el.append(msg.text.replace(/\n/g, '<br>'));
                }
                scroll_log_to_bottom(el);
            });
        } else {
            $('#log-content, #log-content2').hide();
            if (logEventSource) {
                logEventSource.close();
                logEventSource = null;
            }
        }
    }

    function togglePasswordVisibility(inputId) {
        var input = document.getElementById(inputId);
        var icon = input.nextElementSibling;
        
        if (input.type === "password") {
            input.type = "text";
            icon.textContent = "visibility";
        } else {
            input.type = "password";
            icon.textContent = "visibility_off";
        }
    }
    
    function update_password() {
    var current_password = $('#current_password').val();
    var new_password = $('#new_password').val();

    if (!current_password) {
        message('请输入当前密码');
        return;
    }

    if (!new_password) {
        message('请输入新密码');
        return;
    }

    if (new_password.indexOf(' ') !== -1) {
        message('新密码不能包含空格');
        return;
    }

    if (new_password.length < 5) {
        message('新密码长度必须大于等于5位');
        return;
    }

    ajax_request({
        url: '/api/update_password',
        type: 'POST',
        data: JSON.stringify({
            current_password: current_password,
            new_password: new_password
        })
    })
        .done(function(response) {
            if (response.result === 'ok') {
                message('密码更新成功');
                $('#current_password').val('');
                $('#new_password').val('');

                // Handle session update
                if (response.relogin) {
                    setTimeout(function() {
                        message('密码已更新，需要重新登录');
                        setTimeout(function() {
                            show_login_dialog('密码已更改，请使用新密码登录');
                        }, 1000);
                    }, 500);
                }
            } else {
                message(response.message || '密码更新失败');
            }
        });
}

    function export_config() {
        var session = getCookie('session');
        fetch('/export_config', {
            headers: { 'Authorization': 'Bearer ' + session }
        }).then(function(res) {
            if (res.status === 401) {
                message('会话已过期，请重新登录');
                return;
            }
            return res.blob();
        }).then(function(blob) {
            if (!blob) return;
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'v2raypi-config.zip';
            a.click();
            URL.revokeObjectURL(url);
        }).catch(function() {
            message('导出失败');
        });
    }

    function import_config(file) {
        if (!file) return;
        mdui.confirm('导入配置将完整覆盖现有配置，确定继续吗？', '导入确认', function() {
            var formData = new FormData();
            formData.append('file', file);
            $.ajax({
                url: '/import_config',
                type: 'POST',
                headers: { 'Authorization': 'Bearer ' + getCookie('session') },
                data: formData,
                processData: false,
                contentType: false,
                success: function(data) {
                    if (data.result === 'ok') {
                        message('导入成功，页面将刷新');
                        setTimeout(function() { window.location.reload(); }, 1500);
                    } else {
                        message(data.message || '导入失败');
                    }
                },
                error: function() {
                    message('导入失败');
                }
            });
        });
    }

    function getCookie(name) {
        var v = document.cookie.match('(^|;) ?' + name + '=([^;]*)(;|$)');
        return v ? v[2] : '';
    }

$(document).ready(function() {
        refresh();

        // Log switch handler
        $('#log-switch').change(function() {
            toggle_log_display($(this).is(':checked'));
        });

        // Selecting another branch invalidates the last check result
        $('#v2raypi_branch').change(function() {
            $('#update_btn_v2raypi').toggle($(this).val() !== window.g_v2raypi_current_branch);
            get_v2raypi_recent_commits();
        });

        mdui.mutation();
    });
</script>
