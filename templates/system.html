<script type="text/javascript">
    //# sourceURL=system.js
    function check_result(data) {
        return data && data["result"] === "ok";
    }

    function confirm_options() {
        return {
            confirmText: t("system.confirm.ok"),
            cancelText: t("system.confirm.cancel")
        };
    }

    function render_v2raypi_branches(response) {
        var select = $('#v2raypi_branch');
        var selected = select.val();
        select.empty();
        response.branches.forEach(function(branch) {
            var label = branch === response.current
                ? t("system.v2raypi.currentBranch", { branch: branch })
                : branch;
            select.append($('<option></option>').attr('value', branch).text(label));
        });
        if (selected && response.branches.indexOf(selected) !== -1) {
            select.val(selected);
        } else if (response.current) {
            select.val(response.current);
        }
        $('#v2raypi_branch_wrapper').show();
        // The select is populated asynchronously, so mdui cannot auto-init
        // it. Keep the instance to refresh the widget after option changes.
        if (window.g_v2raypi_branch_select) {
            window.g_v2raypi_branch_select.handleUpdate();
        } else {
            window.g_v2raypi_branch_select = new mdui.Select(select[0], { position: 'bottom' });
        }
    }

    function refresh() {
        ajax_request({ url: "/get_system_status" })
            .done(function (data) {
                if (check_result(data)) {
                    $("#mihomo_current_ver").html(data["version"]);
                }
            });
        get_v2raypi_recent_commits();
        get_v2raypi_branches();
    }

    function get_v2raypi_branches() {
        ajax_request({ url: '/get_v2raypi_branches' })
            .done(function(response) {
            if (check_result(response)) {
                window.g_v2raypi_current_branch = response.current;
                window.g_v2raypi_branches = response;
                render_v2raypi_branches(response);
            }
        });
    }


    function get_v2raypi_recent_commits() {
        var branch = $('#v2raypi_branch').val();
        ajax_request({ url: '/get_v2raypi_recent_commits', data: { branch: branch } })
            .done(function(response) {
            if (check_result(response)) {
                if (response.last_update) {
                    $('#lastUpdateTime').text(response.last_update);
                }

                var container = $('#recent_commits');
                container.empty();
                response.commits.forEach(function(commit) {
                    var parts = commit.split('|');
                    var date = parts[0];
                    var message = parts[1];
                    var commitDiv = $('<div class="mdui-text-color-theme-text" style="font-family: monospace; display: flex;">' +
                        '<span class="mdui-color-grey-500 mdui-text-color-white" style="padding: 2px 5px; margin-right: 8px; border-radius: 3px; flex-shrink: 0;">' + date + '</span>' +
                        '<span style="border: 1px solid #e0e0e0; padding: 2px 8px; border-radius: 3px; flex-grow: 1;">' + message + '</span>' +
                        '</div>');
                    container.append(commitDiv);
                });
            }
        });
    }

    function check_v2raypi_updates() {
        var branch = $('#v2raypi_branch').val();
        var toast = pop_toast(t("system.update.checking"));
        ajax_request({ url: "/check_v2raypi_updates", data: { branch: branch } })
            .done(function(response) {
            if (check_result(response)) {
                var container = $('#recent_commits');
                container.empty();
                response.commits.slice().reverse().forEach(function(commit) {
                    var parts = commit.split('|');
                    var date = parts[0];
                    var message = parts[1];
                    var commitDiv = $('<div class="mdui-text-color-theme-text" style="font-family: monospace; display: flex;">' +
                        '<span class="mdui-color-green-300 mdui-text-color-white" style="padding: 2px 5px; margin-right: 8px; border-radius: 3px; flex-shrink: 0;">' + date + '</span>' +
                        '<span style="border: 1px solid #e0e0e0; padding: 2px 8px; border-radius: 3px; flex-grow: 1;">' + message + '</span>' +
                        '</div>');
                    container.prepend(commitDiv);
                });
                if (response.commits.length > 0) {
                    $('#update_btn_v2raypi').show();
                    message(t("system.update.available"));
                } else {
                    $('#update_btn_v2raypi').hide();
                    get_v2raypi_recent_commits();
                    message(t("system.update.latest"));
                }
            } else {
                message(t("system.update.checkFailed"));
            }
            close_toast();
        });
    }

    function check_mihomo_new_ver() {
        message(t("system.mihomo.querying"));
        ajax_request({ url: "/check_mihomo_new_ver" })
            .done(function (data) {
            window.g_new_version = data["version"];
            $("#mihomo_new_ver").html(window.g_new_version)
            var current_version = $("#mihomo_current_ver").html();
            if (window.g_new_version === current_version) {
                message(t("system.mihomo.latest"));
                $("#check_update").show();
                $("#update").hide();
            }
            else {
                message(t("system.mihomo.available"));
                $("#check_update").hide();
                $("#update").show();
            }
        }).fail(function () {
            message(t("system.mihomo.checkFailed"));
        });
    }

    function update_mihomo() {
        pop_toast(t("system.mihomo.upgrading"));
        ajax_request({ url: "/update_mihomo" })
            .done(function (data) {
                if (check_result(data)) {
                    update_toast(t("system.mihomo.upgradeSuccess"))
                }
                else {
                    update_toast(t("system.mihomo.upgradeFailed"))
                }
            })
            .always(function () {
                close_toast();
                refresh();
                check_mihomo_new_ver();
            });
    }

    function update_and_restart_v2raypi() {
        var branch = $('#v2raypi_branch').val();
        var switching = branch && branch !== window.g_v2raypi_current_branch;
        var first_message = switching
            ? t("system.update.switchPrompt", { branch: branch })
            : t("system.update.restartPrompt");
        var second_message = switching
            ? t("system.update.switchWarning", { branch: branch })
            : t("system.update.restartWarning");
        mdui.confirm(first_message, t("system.update.confirmTitle"), function(){
            mdui.confirm(second_message, t("system.confirm.again"), function() {
                pop_toast(t("system.update.updating"));
                ajax_request({ url: "/update_and_restart_v2raypi", data: { branch: branch } })
                    .done(function (data) {
                    if (check_result(data)) {
                        var countdown = 10;
                        var timer = setInterval(function() {
                            update_toast(t("system.update.restartCountdown", { seconds: countdown }));
                            countdown--;
                            if (countdown < 0) {
                                clearInterval(timer);
                                close_toast();
                                window.location.reload();
                            }
                        }, 1000);
                    }
                    else {
                        update_toast(t("system.update.failed"));
                        setTimeout(close_toast, 2000);
                    }
                }).fail(function () {
                    update_toast(t("system.update.failed"));
                    setTimeout(close_toast, 2000);
                });
            }, null, confirm_options());
        }, null, confirm_options());
    }

    function reboot_host() {
        mdui.confirm(t("system.host.rebootPrompt"), t("system.host.rebootTitle"), function(){
            mdui.confirm(t("system.host.rebootWarning"), t("system.confirm.again"), function() {
                pop_toast(t("system.host.rebooting"));
                ajax_request({ url: "/reboot_host" })
                    .done(function (data) {
                    if (check_result(data)) {
                        update_toast(t("system.host.rebootSent"));
                        setTimeout(close_toast, 2000);
                    }
                    else {
                        update_toast(t("system.host.rebootFailed"));
                        setTimeout(close_toast, 2000);
                    }
                }).fail(function () {
                    update_toast(t("system.host.rebootFailed"));
                    setTimeout(close_toast, 2000);
                });
            }, null, confirm_options());
        }, null, confirm_options());
    }

    var logEventSource = null;

    function scroll_log_to_bottom(el) {
        var pre = el.closest('pre');
        pre.scrollTop(pre[0].scrollHeight);
    }

    function toggle_log_display(enabled) {
        if (enabled) {
            $('#log-content').show();
            logEventSource = new EventSource('/stream_logs');

            logEventSource.addEventListener('mihomo', function(e) {
                var msg = JSON.parse(e.data);
                var el = $('#log-mihomo-content');
                if (msg.init) {
                    el.html(msg.text.replace(/\n/g, '<br>'));
                } else {
                    el.append(msg.text.replace(/\n/g, '<br>'));
                }
                scroll_log_to_bottom(el);
            });
        } else {
            $('#log-content').hide();
            if (logEventSource) {
                logEventSource.close();
                logEventSource = null;
            }
        }
    }

    function togglePasswordVisibility(inputId) {
        var input = document.getElementById(inputId);
        var icon = input.nextElementSibling;
        
        if (input.type === "password") {
            input.type = "text";
            icon.textContent = "visibility";
        } else {
            input.type = "password";
            icon.textContent = "visibility_off";
        }
    }
    
    function update_password() {
    var current_password = $('#current_password').val();
    var new_password = $('#new_password').val();

    if (!current_password) {
        message(t("system.password.currentRequired"));
        return;
    }

    if (!new_password) {
        message(t("system.password.newRequired"));
        return;
    }

    if (new_password.indexOf(' ') !== -1) {
        message(t("system.password.noSpaces"));
        return;
    }

    if (new_password.length < 5) {
        message(t("system.password.tooShort"));
        return;
    }

    ajax_request({
        url: '/api/update_password',
        type: 'POST',
        data: JSON.stringify({
            current_password: current_password,
            new_password: new_password
        })
    })
        .done(function(response) {
            if (response.result === 'ok') {
                message(t("system.password.success"));
                $('#current_password').val('');
                $('#new_password').val('');

                // Handle session update
                if (response.relogin) {
                    setTimeout(function() {
                        message(t("system.password.relogin"));
                        setTimeout(function() {
                            show_login_dialog(t("system.password.loginWithNew"));
                        }, 1000);
                    }, 500);
                }
            } else {
                message(I18n.apiError(
                    response,
                    "system.password.currentInvalid"
                ));
            }
        });
}

    function export_config() {
        var session = getCookie('session');
        fetch('/export_config', {
            headers: { 'Authorization': 'Bearer ' + session }
        }).then(function(res) {
            var contentType = res.headers.get('content-type') || '';
            if (contentType.indexOf('application/json') !== -1) {
                return res.json().then(function(data) {
                    message(I18n.apiError(
                        data,
                        "system.backup.exportFailed"
                    ));
                    return null;
                });
            }
            if (!res.ok) throw new Error('Export failed');
            return res.blob();
        }).then(function(blob) {
            if (!blob) return;
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'v2raypi-config.zip';
            a.click();
            URL.revokeObjectURL(url);
        }).catch(function() {
            message(t("system.backup.exportFailed"));
        });
    }

    function import_config(file) {
        if (!file) return;
        mdui.confirm(t("system.backup.importPrompt"), t("system.backup.importTitle"), function() {
            var formData = new FormData();
            formData.append('file', file);
            $.ajax({
                url: '/import_config',
                type: 'POST',
                headers: { 'Authorization': 'Bearer ' + getCookie('session') },
                data: formData,
                processData: false,
                contentType: false,
                success: function(data) {
                    if (data.result === 'ok') {
                        message(t("system.backup.importSuccess"));
                        setTimeout(function() { window.location.reload(); }, 1500);
                    } else {
                        message(I18n.apiError(
                            data,
                            "system.backup.importFailed"
                        ));
                    }
                },
                error: function() {
                    message(t("system.backup.importFailed"));
                }
            });
        }, null, confirm_options());
    }

    function getCookie(name) {
        var v = document.cookie.match('(^|;) ?' + name + '=([^;]*)(;|$)');
        return v ? v[2] : '';
    }

    });
