<script src="/static/js/Chart.js"></script>
<script type="text/javascript">
    //# sourceURL=status.js
    var cpu_bar = null;
    var memory_bar = null;
    var upload_bar = null;
    var download_bar = null;
    var g_mihomo_started_at = null;
    var CHART_SYSTEM_COLOR = "158, 158, 158";
    var CHART_CPU_MIHOMO_COLOR = "255, 99, 132";
    var CHART_MEMORY_MIHOMO_COLOR = "153, 102, 255";

    function format_speed(kb) {
        if (kb >= 1024) return (kb / 1024).toFixed(2) + ' M/s';
        return kb.toFixed(1) + ' K/s';
    }

    // The backend keeps the window, so a chart only has to plot what it is given,
    // right aligned in a fixed number of slots until the window has filled up.
    function plot(chart, series, window_size, datasetIndex) {
        datasetIndex = datasetIndex || 0;
        if (datasetIndex === 0) {
            var slots = [];
            for (var i = 0; i < window_size; i++) slots.push('');
            chart.data.labels = slots;
        }
        var padding = [];
        for (var j = series.length; j < window_size; j++) padding.push(null);
        chart.data.datasets[datasetIndex].data = padding.concat(series);
    }

    function series_last(series) {
        return series.length ? series[series.length - 1] : 0;
    }

    $(document).ready(function () {
        window.g_proxy_mode_select = new mdui.Select("#proxy_mode", { position: "bottom" });

        $("#proxy_mode").change(function () {
            $("#switch_mode").show();
        })

        // The charts and their poller belong to the page, not to a refresh: the
        // window they draw is kept by the backend, so a service action only has
        // to refresh the state above them.
        create_charts();
        update_performance();
        add_interval(setInterval(update_performance, 1000));
        refresh();
        refresh_egress_ip();
    });

    function format_uptime(seconds) {
        seconds = Math.max(0, Math.floor(seconds));
        var days = Math.floor(seconds / 86400);
        var hours = Math.floor((seconds % 86400) / 3600);
        var minutes = Math.floor((seconds % 3600) / 60);
        var secs = seconds % 60;
        var parts = [];
        if (days) {
            parts.push(t("status.uptime.days", { n: days }));
        }
        if (hours) {
            parts.push(t("status.uptime.hours", { n: hours }));
        }
        if (minutes) {
            parts.push(t("status.uptime.minutes", { n: minutes }));
        }
        if (!parts.length || (!days && !hours)) {
            parts.push(t("status.uptime.seconds", { n: secs }));
        }
        return parts.join(" ");
    }

    function render_uptime() {
        var $el = $("#mihomo_uptime_value");
        if (!$el.length) {
            return;
        }
        if (typeof g_mihomo_started_at !== "number" || !isFinite(g_mihomo_started_at)) {
            $el.text("-");
            return;
        }
        $el.text(format_uptime((Date.now() / 1000) - g_mihomo_started_at));
    }

    function refresh() {
        ajax_request({ url: "/get_status" }).then(function (data) {
            if (data["running"]) {
                $("#running").prop("hidden", false);
                $("#stoped").prop("hidden", true);
                $("#start_service").hide();
                $("#stop_services").show();
                $("#restart_service").show();
                g_mihomo_started_at = data["started_at"];
            }
            else {
                $("#running").prop("hidden", true);
                $("#stoped").prop("hidden", false);
                $("#start_service").show();
                $("#stop_services").hide();
                $("#restart_service").hide();
                g_mihomo_started_at = null;
            }
            render_uptime();

            mode = data["proxy_mode"];
            $("#proxy_mode").val(String(mode));
            window.g_proxy_mode_select.handleUpdate();
            $("#mihomo_current_ver").html(data["version"]);
            $("#mihomo_new_ver").html(window.g_new_version);
        });
    }

    function country_flag_url(code) {
        if (!code || !/^[A-Za-z]{2}$/.test(code)) {
            return "";
        }
        return "https://cdn.jsdelivr.net/gh/HatScripts/circle-flags@2.7.0/flags/"
            + code.toLowerCase() + ".svg";
    }

    function format_egress_location(data) {
        return [data.city, data.region, data.country]
            .filter(function (part) { return !!part; })
            .join(", ") || "-";
    }

    function set_egress_flag(code) {
        var $flag = $("#egress_flag");
        var url = country_flag_url(code);
        if (!url) {
            $flag.attr({ src: "", hidden: true, alt: "" });
            return;
        }
        $flag
            .off("error.egressFlag load.egressFlag")
            .on("error.egressFlag", function () {
                $(this).attr({ src: "", hidden: true, alt: "" });
            })
            .on("load.egressFlag", function () {
                $(this).prop("hidden", false);
            })
            .attr({
                src: url,
                alt: String(code || "").toUpperCase(),
                hidden: true
            });
    }

    function egress_latency_class(ms) {
        if (ms <= 500) {
            return "is-fast";
        }
        if (ms < 1000) {
            return "is-fair";
        }
        return "is-slow";
    }

    function set_egress_latency(ms) {
        var $latency = $("#egress_latency_value");
        if (typeof ms !== "number" || !isFinite(ms) || ms < 0) {
            $latency.attr({ hidden: true, title: "" }).text("").removeClass("is-fast is-fair is-slow");
            return;
        }
        var rounded = Math.round(ms);
        $latency
            .text(rounded + " ms")
            .attr("title", t("status.egress.latency").replace("{ms}", String(rounded)))
            .removeClass("is-fast is-fair is-slow")
            .addClass(egress_latency_class(rounded))
            .prop("hidden", false);
    }

    function set_egress_fields(values) {
        $("#egress_ip_value").text(values.ip || "-");
        $("#egress_location_value").text(values.location || "-");
        $("#egress_org_value").text(values.org || "-");
        set_egress_latency(values.latency_ms);
        if (Object.prototype.hasOwnProperty.call(values, "country")) {
            set_egress_flag(values.country);
        }
    }

    function refresh_egress_ip(force) {
        if (!$("#egress_ip_value").length) {
            return;
        }
        var $btn = $("#egress_refresh_btn");
        if ($btn.prop("disabled")) {
            return;
        }
        $btn.prop("disabled", true).addClass("is-refreshing")
            .attr("title", t("status.egress.refreshing"));
        var url = "/get_egress_ip" + (force ? "?force=1" : "");
        ajax_request({ url: url }).then(function (data) {
            if (data && data.ok && data.ip) {
                set_egress_fields({
                    ip: data.ip,
                    location: format_egress_location(data),
                    org: data.org,
                    country: data.country,
                    latency_ms: data.latency_ms
                });
                return;
            }
            var message = t("status.egress.unavailable");
            if (data && data.error === "ipinfo_missing") {
                message = t("status.egress.missing");
            } else if (data && data.error === "ipinfo_rate_limited") {
                message = t("status.egress.rateLimited");
            }
            set_egress_fields({
                ip: message,
                location: "-",
                org: "-",
                country: ""
            });
        }).fail(function () {
            set_egress_fields({
                ip: t("status.egress.unavailable"),
                location: "-",
                org: "-",
                country: ""
            });
        }).always(function () {
            $btn.prop("disabled", false).removeClass("is-refreshing")
                .attr("title", t("status.egress.refresh"));
        });
    }

    function line_dataset(color) {
        return {
            backgroundColor: 'rgba(' + color + ', 0.15)',
            borderColor: 'rgb(' + color + ')',
            borderWidth: 2,
            pointRadius: 0,
            fill: true,
            tension: 0.4,
            data: []
        };
    }

    // Every chart is the same flat sparkline: no points, no tooltips, no legend,
    // and no animation because the window is redrawn once a second.
    function create_chart(canvas, color, title, scale_max, processColor) {
        var ticks = {beginAtZero: true, display: false};
        if (scale_max !== null) {
            ticks.max = scale_max;
        }
        var datasets = [line_dataset(color)];
        if (processColor) {
            datasets.push(line_dataset(processColor));
        }
        return new Chart($(canvas), {
            type: 'line',
            data: {
                labels: [],
                datasets: datasets
            },
            options: {
                responsive: true,
                animation: { duration: 0 },
                maintainAspectRatio: false,
                tooltips: {enabled: false},
                hover: {mode: null},
                legend: {display: false},
                title: {display: false},
                scales: {
                    xAxes: [{display: false}],
                    yAxes: [{display: true, ticks: ticks}]
                }
            }
        });
    }

    function create_charts() {
        // A percentage tops out at 100, while a transfer rate has no ceiling, so
        // update_performance() rescales the traffic charts from their own window.
        // CPU/memory overlay the mihomo process in the original colors and draw
        // the system-wide series in gray behind it.
        cpu_bar = create_chart("#cpu_usage", CHART_SYSTEM_COLOR, t("status.chart.cpu"), 100, CHART_CPU_MIHOMO_COLOR);
        memory_bar = create_chart("#memory_usage", CHART_SYSTEM_COLOR, t("status.chart.memory"), 100, CHART_MEMORY_MIHOMO_COLOR);
        upload_bar = create_chart("#upload_usage", "255, 152, 0", t("status.chart.upload"), null);
        download_bar = create_chart("#download_usage", "2, 136, 209", t("status.chart.download"), null);
    }

    
    function update_performance() {
        render_uptime();
        ajax_request({ url: "/get_performance" }).then(function (data) {
            var history = data["history"] || {};
            var window_size = history["window"] || 0;
            var cpu_series = history["cpu"] || [];
            var cpu_mihomo = history["cpu_mihomo"] || [];
            var memory_series = history["memory"] || [];
            var memory_mihomo = history["memory_mihomo"] || [];
            var upload_series = history["upload"] || [];
            var download_series = history["download"] || [];

            plot(cpu_bar, cpu_series, window_size);
            plot(cpu_bar, cpu_mihomo, window_size, 1);
            $("#cpu_caption .chart-caption-system").text(t("status.chart.cpu_system", {
                value: series_last(cpu_series).toFixed(1)
            }));
            $("#cpu_caption .chart-caption-mihomo").text(t("status.chart.cpu_mihomo", {
                value: series_last(cpu_mihomo).toFixed(1)
            }));
            cpu_bar.update(0);

            var memory_status = data["memory"];
            var mihomo_status = data["mihomo"] || {};
            plot(memory_bar, memory_series, window_size);
            plot(memory_bar, memory_mihomo, window_size, 1);
            $("#memory_caption .chart-caption-system").text(t("status.chart.memory_system", {
                percent: memory_status["percent"].toFixed(1),
                used: memory_status["used"],
                total: memory_status["total"]
            }));
            $("#memory_caption .chart-caption-mihomo").text(t("status.chart.memory_mihomo", {
                percent: series_last(memory_mihomo).toFixed(1),
                used: mihomo_status["memory_mb"] || 0
            }));
            memory_bar.update(0);

            // Both traffic charts share one scale so their curves stay comparable.
            var rates = upload_series.concat(download_series);
            var peak = rates.length ? Math.max.apply(null, rates) : 1;
            var yMax = Math.ceil(peak * 1.3) || 1;

            plot(upload_bar, upload_series, window_size);
            $("#upload_heading").text(t("status.chart.upload_value", {
                speed: format_speed(series_last(upload_series))
            }));
            upload_bar.options.scales.yAxes[0].ticks.max = yMax;
            upload_bar.update(0);

            plot(download_bar, download_series, window_size);
            $("#download_heading").text(t("status.chart.download_value", {
                speed: format_speed(series_last(download_series))
            }));
            download_bar.options.scales.yAxes[0].ticks.max = yMax;
            download_bar.update(0);
        });
    }
