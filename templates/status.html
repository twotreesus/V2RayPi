<link rel="stylesheet" href="/static/css/Chart.css">
<style>
    .node-name {
        color: inherit;
    }
    .node-type-badge {
        display: inline-block;
        font-size: 10px;
        font-weight: 600;
        line-height: 1;
        padding: 1px 4px;
        border-radius: 3px;
        border: 1px solid;
        margin-right: 6px;
        vertical-align: middle;
    }
    .node-type-vmess {
        color: #1976d2;
        border-color: #1976d2;
        background-color: rgba(25, 118, 210, 0.08);
    }
    .node-type-vless {
        color: #7b1fa2;
        border-color: #7b1fa2;
        background-color: rgba(123, 31, 162, 0.08);
    }
    .node-type-anytls {
        color: #0097a7;
        border-color: #0097a7;
        background-color: rgba(0, 151, 167, 0.08);
    }
    .node-type-hy2 {
        color: #2e7d32;
        border-color: #2e7d32;
        background-color: rgba(46, 125, 50, 0.08);
    }
    .node-type-ss {
        color: #e91e63;
        border-color: #e91e63;
        background-color: rgba(233, 30, 99, 0.08);
    }
</style>
<div id="status_page" class="mdui-container">
    <p></p>
    <div class="mdui-row">
        <div class="mdui-table-fluid">
            <table class="mdui-table">
                <tbody>
                <tr>
                    <td colspan="2" class="mdui-typo">
                        <h5 style="margin: 0;">运行状态</h5>
                    </td>
                </tr>
                <tr>
                    <td>运行状态</td>
                    <td>
                        <div class="mdui-row">
                            <div id="running" class="mdui-chip" style="display: none">
                                <span class="mdui-chip-icon mdui-color-green"><i class="mdui-icon material-icons">play_arrow</i></span>
                                <span class="mdui-chip-title">运行中</span>
                            </div>
                            <div id="stoped" class="mdui-chip" style="display: none">
                                <span class="mdui-chip-icon mdui-color-red"><i class="mdui-icon material-icons">stop</i></span>
                                <span class="mdui-chip-title">已停止</span>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>运行控制</td>
                    <td>
                        <div class="mdui-row">
                            <div id="start_service" class="mdui-chip" onclick="start_service()" style="display: none">
                                <span class="mdui-chip-icon mdui-color-green"><i class="mdui-icon material-icons">play_arrow</i></span>
                                <span class="mdui-chip-title">启动</span>
                            </div>
                            <div id="stop_services" class="mdui-chip" onclick="stop_service()" style="display: none">
                                <span class="mdui-chip-icon mdui-color-red"><i class="mdui-icon material-icons">stop</i></span>
                                <span class="mdui-chip-title">停止</span>
                            </div>
                            <div id="restart_service" class="mdui-chip" onclick="restart_service()" style="display: none">
                                <span class="mdui-chip-icon mdui-color-yellow-700"><i class="mdui-icon material-icons">settings_backup_restore</i></span>
                                <span class="mdui-chip-title">重启</span>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>代理模式</td>
                    <td>
                        <div class="mdui-row">
                            <div class="mdui-col-sm-3">
                                <label for="proxy_mode"></label>
                                <select id="proxy_mode" class="mdui-select" mdui-select="{position: 'bottom'}">
                                    <option value="0">直连</option>
                                    <option value="1">智能分流</option>
                                    <option value="2">全局代理</option>
                                </select>
                            </div>
                            <div id="switch_mode" class="mdui-col-sm-3" style="display: none">
                                <button class="mdui-btn mdui-btn-raised mdui-btn-dense mdui-color-theme-accent mdui-ripple" onclick="switch_proxy_mode()">切换</button>
                            </div>
                        </div>
                    </td>
                </tr>

                <tr class="mdui-color-grey-100"><td colspan="2"></td></tr>
                <tr>
                    <td colspan="2" class="mdui-typo">
                        <h5 style="margin: 0;">节点信息</h5>
                    </td>
                </tr>
                <tr>
                    <td>名称</td>
                    <td id="remark"></td>
                </tr>
                <tr>
                    <td>地址</td>
                    <td id="host"></td>
                </tr>
                <tr class="mdui-color-grey-100"><td colspan="2"></td></tr>
                <tr>
                    <td colspan="2" class="mdui-typo">
                        <h5 style="margin: 0;">性能监控</h5>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" style="max-width: 0; width: 100%;">
                        <div style="display: flex; gap: 12px; width: 100%; box-sizing: border-box; overflow: hidden; padding-right: 16px;">
                            <div style="flex: 1; min-width: 0;">
                                <canvas id="cpu_usage" class="chartjs-render-monitor" height="140"></canvas>
                            </div>
                            <div style="flex: 1; min-width: 0;">
                                <canvas id="memory_usage" class="chartjs-render-monitor" height="140"></canvas>
                            </div>
                            <div style="flex: 1; min-width: 0;">
                                <canvas id="download_usage" class="chartjs-render-monitor" height="140"></canvas>
                            </div>
                            <div style="flex: 1; min-width: 0;">
                                <canvas id="upload_usage" class="chartjs-render-monitor" height="140"></canvas>
                            </div>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <p></p>
</div>

<script src="/static/js/Chart.js"></script>
<script type="text/javascript">
    //# sourceURL=status.js
    var cpu_bar = null;
    var memory_bar = null;
    var upload_bar = null;
    var download_bar = null;
    var cpu_history = [];
    var memory_history = [];
    var upload_history = [];
    var download_history = [];
    var upload_samples = [];
    var download_samples = [];
    var HISTORY_LEN = 30;
    var SMOOTH_LEN = 5;

    function format_speed(kb) {
        if (kb >= 1024) return (kb / 1024).toFixed(2) + ' MB/s';
        if (kb >= 1) return kb.toFixed(1) + ' KB/s';
        return Math.round(kb * 1024) + ' B/s';
    }

    function protocol_badge(protocol) {
        protocol = (protocol || "vmess").toLowerCase();
        if (protocol === "hysteria2") {
            return { label: "hy2", className: "hy2" };
        }
        return { label: protocol, className: protocol };
    }

    $(document).ready(function () {
        $("#proxy_mode").change(function () {
            $("#switch_mode").show();
        })

        refresh()
    });

    function refresh() {
        ajax_request({ url: "/get_status" }).then(function (data) {
            if (data["running"]) {
                $("#running").show();
                $("#stoped").hide();
                $("#start_service").hide();
                $("#stop_services").show();
                $("#restart_service").show();
            }
            else {
                $("#running").hide();
                $("#stoped").show();
                $("#start_service").show();
                $("#stop_services").hide();
                $("#restart_service").hide();
            }

            mode = data["proxy_mode"];
            $("#proxy_mode").prop("selectedIndex", mode);
            $("#v2ray_current_ver").html(data["version"]);
            $("#v2ray_new_ver").html(window.g_new_version);
            var badge = protocol_badge(data["protocol"]);
            var typeBadge = '<span class="node-type-badge node-type-' + badge.className + '">' + badge.label + '</span>';
            $("#remark").html(typeBadge + ' <span class="node-name">' + data["ps"] + '</span>');
            $("#host").html(data["add"]);


            cpu_history = [];
            memory_history = [];
            var cpuLabels = [];
            var cpuData = [];
            for (var i = 0; i < HISTORY_LEN; i++) {
                cpuLabels.push('');
                cpuData.push(null);
            }
            cpu_bar = new Chart($("#cpu_usage"), {
                type: 'line',
                data: {
                    labels: cpuLabels,
                    datasets: [{
                        backgroundColor: 'rgba(255, 99, 132, 0.15)',
                        borderColor: 'rgb(255, 99, 132)',
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: true,
                        tension: 0.4,
                        data: cpuData
                    }]
                },
                options: {
                    responsive: true,
                    animation: { duration: 0 },
                    maintainAspectRatio: false,
                    tooltips: {enabled: false},
                    hover: {mode: null},
                    legend: {display: false},
                    title: {display: true, text: 'CPU 占用率'},
                    scales: {
                        xAxes: [{display: false}],
                        yAxes: [{
                            display: true,
                            ticks: {beginAtZero: true, max: 100, display: false}
                        }]
                    }
                }
            });

            var memLabels = [];
            var memData = [];
            for (var j = 0; j < HISTORY_LEN; j++) {
                memLabels.push('');
                memData.push(null);
            }
            memory_bar = new Chart($("#memory_usage"), {
                type: 'line',
                data: {
                    labels: memLabels,
                    datasets: [{
                        backgroundColor: 'rgba(153, 102, 255, 0.15)',
                        borderColor: 'rgb(153, 102, 255)',
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: true,
                        tension: 0.4,
                        data: memData
                    }]
                },
                options: {
                    responsive: true,
                    animation: { duration: 0 },
                    maintainAspectRatio: false,
                    tooltips: {enabled: false},
                    hover: {mode: null},
                    legend: {display: false},
                    title: {display: true, text: '内存占用率'},
                    scales: {
                        xAxes: [{display: false}],
                        yAxes: [{
                            display: true,
                            ticks: {beginAtZero: true, max: 100, display: false}
                        }]
                    }
                }
            });

            upload_history = [];
            download_history = [];
            upload_samples = [];
            download_samples = [];
            var netLabels = [];
            var netUpData = [];
            var netDownData = [];
            for (var k = 0; k < HISTORY_LEN; k++) {
                netLabels.push('');
                netUpData.push(null);
                netDownData.push(null);
            }
            upload_bar = new Chart($("#upload_usage"), {
                type: 'line',
                data: {
                    labels: netLabels.slice(),
                    datasets: [{
                        backgroundColor: 'rgba(255, 152, 0, 0.15)',
                        borderColor: 'rgb(255, 152, 0)',
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: true,
                        tension: 0.4,
                        data: netUpData.slice()
                    }]
                },
                options: {
                    responsive: true,
                    animation: { duration: 0 },
                    maintainAspectRatio: false,
                    tooltips: {enabled: false},
                    hover: {mode: null},
                    legend: {display: false},
                    title: {display: true, text: '上传速度'},
                    scales: {
                        xAxes: [{display: false}],
                        yAxes: [{display: true, ticks: {beginAtZero: true, display: false}}]
                    }
                }
            });
            download_bar = new Chart($("#download_usage"), {
                type: 'line',
                data: {
                    labels: netLabels.slice(),
                    datasets: [{
                        backgroundColor: 'rgba(2, 136, 209, 0.15)',
                        borderColor: 'rgb(2, 136, 209)',
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: true,
                        tension: 0.4,
                        data: netDownData.slice()
                    }]
                },
                options: {
                    responsive: true,
                    animation: { duration: 0 },
                    maintainAspectRatio: false,
                    tooltips: {enabled: false},
                    hover: {mode: null},
                    legend: {display: false},
                    title: {display: true, text: '下载速度'},
                    scales: {
                        xAxes: [{display: false}],
                        yAxes: [{display: true, ticks: {beginAtZero: true, display: false}}]
                    }
                }
            });
        });

        add_interval(setInterval(update_performance, 1000));
    }
    
    function update_performance() {
        ajax_request({ url: "/get_performance" }).then(function (data) {
            cpu_status = data["cpu"];
            var values = Object.keys(cpu_status).map(function(k) { return cpu_status[k]; });
            var avg = values.reduce(function(a, b) { return a + b; }, 0) / (values.length || 1);
            cpu_history.push(avg);
            if (cpu_history.length > HISTORY_LEN) cpu_history.shift();
            var cpuPadded = [];
            for (var i = 0; i < HISTORY_LEN - cpu_history.length; i++) cpuPadded.push(null);
            cpu_bar.data.datasets[0].data = cpuPadded.concat(cpu_history);
            cpu_bar.options.title.text = 'CPU 占用率  ' + avg.toFixed(1) + '%';
            cpu_bar.update();

            memory_status = data["memory"];
            memory_history.push(memory_status["percent"]);
            if (memory_history.length > HISTORY_LEN) memory_history.shift();
            var memPadded = [];
            for (var j = 0; j < HISTORY_LEN - memory_history.length; j++) memPadded.push(null);
            memory_bar.data.datasets[0].data = memPadded.concat(memory_history);
            memory_bar.data.datasets[0].label = "total: " + memory_status["total"] + " MB  used: " + memory_status["used"] + " MB";
            memory_bar.options.title.text = '内存占用率  ' + memory_status["percent"].toFixed(1) + '%  (' + memory_status["used"] + ' / ' + memory_status["total"] + ' MB)';
            memory_bar.update();

            var net_status = data["network"];
            upload_samples.push(net_status["upload"]);
            download_samples.push(net_status["download"]);
            if (upload_samples.length > SMOOTH_LEN) upload_samples.shift();
            if (download_samples.length > SMOOTH_LEN) download_samples.shift();
            var up = upload_samples.reduce(function(a, b) { return a + b; }, 0) / upload_samples.length;
            var down = download_samples.reduce(function(a, b) { return a + b; }, 0) / download_samples.length;
            upload_history.push(up);
            download_history.push(down);
            if (upload_history.length > HISTORY_LEN) upload_history.shift();
            if (download_history.length > HISTORY_LEN) download_history.shift();
            var upPadded = [];
            for (var n = 0; n < HISTORY_LEN - upload_history.length; n++) upPadded.push(null);
            var downPadded = [];
            for (var m = 0; m < HISTORY_LEN - download_history.length; m++) downPadded.push(null);
            var allNet = upload_history.concat(download_history).filter(function(v) { return v !== null; });
            var netMax = allNet.length ? Math.max.apply(null, allNet) : 1;
            var yMax = Math.ceil(netMax * 1.3) || 1;
            upload_bar.data.datasets[0].data = upPadded.concat(upload_history);
            upload_bar.options.title.text = '上传速度  ' + format_speed(up);
            upload_bar.options.scales.yAxes[0].ticks.max = yMax;
            upload_bar.update();
            download_bar.data.datasets[0].data = downPadded.concat(download_history);
            download_bar.options.title.text = '下载速度  ' + format_speed(down);
            download_bar.options.scales.yAxes[0].ticks.max = yMax;
            download_bar.update();
        });
    }



    function start_service() {
        pop_toast("正在启动...");
        ajax_request({ url: "/start_service" }).then(function (data) {
            if (check_result(data)) {
                update_toast("启动成功")
            }
            else {
                update_toast("启动失败")
            }
        }).always(function () {
            close_toast();
            refresh();
        });
    }

    function stop_service() {
        pop_toast("正在停止...");
        ajax_request({ url: "/stop_service" }).then(function (data) {
            if (check_result(data)) {
                update_toast("停止成功")
            }
            else {
                update_toast("停止失败")
            }
        }).always(function () {
            close_toast();
            refresh();
        });
    }

    function restart_service() {
        pop_toast("正在重启...");
        ajax_request({ url: "/restart_service" }).then(function (data) {
            if (check_result(data)) {
                update_toast("重启成功")
            }
            else {
                update_toast("重启失败")
            }
        }).always(function () {
            close_toast();
            refresh();
        });
    }

    function switch_proxy_mode() {
        pop_toast("正在切换代理模式...");
        mode = $("#proxy_mode").prop('selectedIndex')
        ajax_request({ url: "/switch_proxy_mode", data: { "mode": mode } })
            .then(function (data) {
                if (check_result(data)) {
                    update_toast("切换成功")
                    $("#switch_mode").hide();
                }
                else {
                    update_toast("切换失败")
                }
            }).always(function () {
                close_toast();
                refresh();
            });
    }
</script>
