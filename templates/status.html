<script src="/static/js/Chart.js"></script>
<script type="text/javascript">
    //# sourceURL=status.js
    var cpu_bar = null;
    var memory_bar = null;
    var upload_bar = null;
    var download_bar = null;
    var cpu_history = [];
    var memory_history = [];
    var upload_history = [];
    var download_history = [];
    var upload_samples = [];
    var download_samples = [];
    var HISTORY_LEN = 30;
    var SMOOTH_LEN = 5;

    function format_speed(kb) {
        if (kb >= 1024) return (kb / 1024).toFixed(2) + ' MB/s';
        if (kb >= 1) return kb.toFixed(1) + ' KB/s';
        return Math.round(kb * 1024) + ' B/s';
    }

    function protocol_badge(protocol) {
        // The protocol comes straight from the Clash `type` field, so any type
        // mihomo supports can show up here.  Only a few get their own colour;
        // the rest share a neutral badge instead of an undefined class.
        protocol = (protocol || "").toLowerCase();
        var labels = { hysteria2: "hy2", hysteria: "hy1", socks5: "socks", wireguard: "wg" };
        var styled = ["vmess", "vless", "ss", "anytls", "mieru", "trojan", "tuic", "hy2"];
        var label = labels[protocol] || protocol || "unknown";
        var className = styled.indexOf(label) !== -1 ? label : "other";
        return { label: label, className: className };
    }

    $(document).ready(function () {
        window.g_proxy_mode_select = new mdui.Select("#proxy_mode", { position: "bottom" });

        $("#proxy_mode").change(function () {
            $("#switch_mode").show();
        })

        refresh()
    });

    function refresh() {
        ajax_request({ url: "/get_status" }).then(function (data) {
            if (data["running"]) {
                $("#running").show();
                $("#stoped").hide();
                $("#start_service").hide();
                $("#stop_services").show();
                $("#restart_service").show();
            }
            else {
                $("#running").hide();
                $("#stoped").show();
                $("#start_service").show();
                $("#stop_services").hide();
                $("#restart_service").hide();
            }

            mode = data["proxy_mode"];
            $("#proxy_mode").val(String(mode));
            window.g_proxy_mode_select.handleUpdate();
            $("#mihomo_current_ver").html(data["version"]);
            $("#mihomo_new_ver").html(window.g_new_version);
            var badge = protocol_badge(data["protocol"]);
            var typeBadge = '<span class="node-type-badge node-type-' + badge.className + '">' + badge.label + '</span>';
            $("#remark").html(typeBadge + ' <span class="node-name">' + data["ps"] + '</span>');
            $("#host").html(data["add"]);


            cpu_history = [];
            memory_history = [];
            var cpuLabels = [];
            var cpuData = [];
            for (var i = 0; i < HISTORY_LEN; i++) {
                cpuLabels.push('');
                cpuData.push(null);
            }
            cpu_bar = new Chart($("#cpu_usage"), {
                type: 'line',
                data: {
                    labels: cpuLabels,
                    datasets: [{
                        backgroundColor: 'rgba(255, 99, 132, 0.15)',
                        borderColor: 'rgb(255, 99, 132)',
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: true,
                        tension: 0.4,
                        data: cpuData
                    }]
                },
                options: {
                    responsive: true,
                    animation: { duration: 0 },
                    maintainAspectRatio: false,
                    tooltips: {enabled: false},
                    hover: {mode: null},
                    legend: {display: false},
                    title: {display: true, text: t("status.chart.cpu")},
                    scales: {
                        xAxes: [{display: false}],
                        yAxes: [{
                            display: true,
                            ticks: {beginAtZero: true, max: 100, display: false}
                        }]
                    }
                }
            });

            var memLabels = [];
            var memData = [];
            for (var j = 0; j < HISTORY_LEN; j++) {
                memLabels.push('');
                memData.push(null);
            }
            memory_bar = new Chart($("#memory_usage"), {
                type: 'line',
                data: {
                    labels: memLabels,
                    datasets: [{
                        backgroundColor: 'rgba(153, 102, 255, 0.15)',
                        borderColor: 'rgb(153, 102, 255)',
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: true,
                        tension: 0.4,
                        data: memData
                    }]
                },
                options: {
                    responsive: true,
                    animation: { duration: 0 },
                    maintainAspectRatio: false,
                    tooltips: {enabled: false},
                    hover: {mode: null},
                    legend: {display: false},
                    title: {display: true, text: t("status.chart.memory")},
                    scales: {
                        xAxes: [{display: false}],
                        yAxes: [{
                            display: true,
                            ticks: {beginAtZero: true, max: 100, display: false}
                        }]
                    }
                }
            });

            upload_history = [];
            download_history = [];
            upload_samples = [];
            download_samples = [];
            var netLabels = [];
            var netUpData = [];
            var netDownData = [];
            for (var k = 0; k < HISTORY_LEN; k++) {
                netLabels.push('');
                netUpData.push(null);
                netDownData.push(null);
            }
            upload_bar = new Chart($("#upload_usage"), {
                type: 'line',
                data: {
                    labels: netLabels.slice(),
                    datasets: [{
                        backgroundColor: 'rgba(255, 152, 0, 0.15)',
                        borderColor: 'rgb(255, 152, 0)',
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: true,
                        tension: 0.4,
                        data: netUpData.slice()
                    }]
                },
                options: {
                    responsive: true,
                    animation: { duration: 0 },
                    maintainAspectRatio: false,
                    tooltips: {enabled: false},
                    hover: {mode: null},
                    legend: {display: false},
                    title: {display: true, text: t("status.chart.upload")},
                    scales: {
                        xAxes: [{display: false}],
                        yAxes: [{display: true, ticks: {beginAtZero: true, display: false}}]
                    }
                }
            });
            download_bar = new Chart($("#download_usage"), {
                type: 'line',
                data: {
                    labels: netLabels.slice(),
                    datasets: [{
                        backgroundColor: 'rgba(2, 136, 209, 0.15)',
                        borderColor: 'rgb(2, 136, 209)',
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: true,
                        tension: 0.4,
                        data: netDownData.slice()
                    }]
                },
                options: {
                    responsive: true,
                    animation: { duration: 0 },
                    maintainAspectRatio: false,
                    tooltips: {enabled: false},
                    hover: {mode: null},
                    legend: {display: false},
                    title: {display: true, text: t("status.chart.download")},
                    scales: {
                        xAxes: [{display: false}],
                        yAxes: [{display: true, ticks: {beginAtZero: true, display: false}}]
                    }
                }
            });
        });

        add_interval(setInterval(update_performance, 1000));
    }
    
    function update_performance() {
        ajax_request({ url: "/get_performance" }).then(function (data) {
            cpu_status = data["cpu"];
            var values = Object.keys(cpu_status).map(function(k) { return cpu_status[k]; });
            var avg = values.reduce(function(a, b) { return a + b; }, 0) / (values.length || 1);
            cpu_history.push(avg);
            if (cpu_history.length > HISTORY_LEN) cpu_history.shift();
            var cpuPadded = [];
            for (var i = 0; i < HISTORY_LEN - cpu_history.length; i++) cpuPadded.push(null);
            cpu_bar.data.datasets[0].data = cpuPadded.concat(cpu_history);
            cpu_bar.options.title.text = t("status.chart.cpu_value", {
                value: avg.toFixed(1)
            });
            cpu_bar.update();

            memory_status = data["memory"];
            memory_history.push(memory_status["percent"]);
            if (memory_history.length > HISTORY_LEN) memory_history.shift();
            var memPadded = [];
            for (var j = 0; j < HISTORY_LEN - memory_history.length; j++) memPadded.push(null);
            memory_bar.data.datasets[0].data = memPadded.concat(memory_history);
            memory_bar.data.datasets[0].label = t("status.chart.memory_details", {
                total: memory_status["total"],
                used: memory_status["used"]
            });
            memory_bar.options.title.text = t("status.chart.memory_value", {
                percent: memory_status["percent"].toFixed(1),
                used: memory_status["used"],
                total: memory_status["total"]
            });
            memory_bar.update();

            var net_status = data["network"];
            upload_samples.push(net_status["upload"]);
            download_samples.push(net_status["download"]);
            if (upload_samples.length > SMOOTH_LEN) upload_samples.shift();
            if (download_samples.length > SMOOTH_LEN) download_samples.shift();
            var up = upload_samples.reduce(function(a, b) { return a + b; }, 0) / upload_samples.length;
            var down = download_samples.reduce(function(a, b) { return a + b; }, 0) / download_samples.length;
            upload_history.push(up);
            download_history.push(down);
            if (upload_history.length > HISTORY_LEN) upload_history.shift();
            if (download_history.length > HISTORY_LEN) download_history.shift();
            var upPadded = [];
            for (var n = 0; n < HISTORY_LEN - upload_history.length; n++) upPadded.push(null);
            var downPadded = [];
            for (var m = 0; m < HISTORY_LEN - download_history.length; m++) downPadded.push(null);
            var allNet = upload_history.concat(download_history).filter(function(v) { return v !== null; });
            var netMax = allNet.length ? Math.max.apply(null, allNet) : 1;
            var yMax = Math.ceil(netMax * 1.3) || 1;
            upload_bar.data.datasets[0].data = upPadded.concat(upload_history);
            upload_bar.options.title.text = t("status.chart.upload_value", {
                speed: format_speed(up)
            });
            upload_bar.options.scales.yAxes[0].ticks.max = yMax;
            upload_bar.update();
            download_bar.data.datasets[0].data = downPadded.concat(download_history);
            download_bar.options.title.text = t("status.chart.download_value", {
                speed: format_speed(down)
            });
            download_bar.options.scales.yAxes[0].ticks.max = yMax;
            download_bar.update();
        });
    }



    function start_service() {
        pop_toast(t("status.toast.starting"));
        ajax_request({ url: "/start_service" }).then(function (data) {
            if (check_result(data)) {
                update_toast(t("status.toast.start_success"))
            }
            else {
                update_toast(t("status.toast.start_failed"))
            }
        }).always(function () {
            close_toast();
            refresh();
        });
    }

    function stop_service() {
        pop_toast(t("status.toast.stopping"));
        ajax_request({ url: "/stop_service" }).then(function (data) {
            if (check_result(data)) {
                update_toast(t("status.toast.stop_success"))
            }
            else {
                update_toast(t("status.toast.stop_failed"))
            }
        }).always(function () {
            close_toast();
            refresh();
        });
    }

    function restart_service() {
        pop_toast(t("status.toast.restarting"));
        ajax_request({ url: "/restart_service" }).then(function (data) {
            if (check_result(data)) {
                update_toast(t("status.toast.restart_success"))
            }
            else {
                update_toast(t("status.toast.restart_failed"))
            }
        }).always(function () {
            close_toast();
            refresh();
        });
    }

    function switch_proxy_mode() {
        pop_toast(t("status.toast.switching_mode"));
        mode = $("#proxy_mode").prop('selectedIndex')
        ajax_request({ url: "/switch_proxy_mode", data: { "mode": mode } })
            .then(function (data) {
                if (check_result(data)) {
                    update_toast(t("status.toast.switch_success"))
                    $("#switch_mode").hide();
                }
                else {
                    update_toast(t("status.toast.switch_failed"))
                }
            }).always(function () {
                close_toast();
                refresh();
            });
    }
</script>
